<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>TV LIVE</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #0a0a0f; --surface: #16161f; --surface-2: #1f1f2e; --surface-3: #2a2a3d;
      --border: rgba(255,255,255,0.06); --text: #f5f5f7; --text-2: #8b8b9e;
      --accent: #8b5cf6; --gradient: linear-gradient(135deg, #8b5cf6 0%, #ec4899 100%);
      --star: #fbbf24; --danger: #ef4444; --success: #10b981;
      --radius-md: 16px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --nav-h: 72px;
      --app-height: 100dvh;
      --pad-x: clamp(12px, 4vw, 16px);
      --gap: clamp(8px, 2.5vw, 12px);
    }
    @supports not (height: 100dvh) { :root { --app-height: 100vh; } }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    html, body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      overflow: hidden; position: fixed; inset: 0;
      width: 100%; height: var(--app-height);
      -webkit-font-smoothing: antialiased; overscroll-behavior: none;
      -webkit-touch-callout: none;
    }
    button, input { font: inherit; color: inherit; touch-action: manipulation; }
    .channel-card, .nav-btn, .player-action, .p-ctrl, .player-back, .header-icon-btn, .modal-btn { -webkit-user-select: none; user-select: none; }
    #app { height: var(--app-height); display: flex; flex-direction: column; position: relative; overflow: hidden; }

    #app-header {
      padding: calc(12px + var(--safe-top)) var(--pad-x) 12px;
      background: rgba(10,10,15,0.92); backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px); z-index: 10;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .brand-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
    .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--gradient); box-shadow: 0 0 12px rgba(139,92,246,0.6); animation: pulse 2s infinite; flex-shrink: 0; }
    @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(0.85); } }
    .brand h1 { margin: 0; font-size: clamp(16px, 4.8vw, 18px); font-weight: 700; letter-spacing: -0.02em; background: var(--gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; white-space: nowrap; }
    .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .live-indicator { display: flex; align-items: center; gap: 5px; padding: 4px 10px; background: rgba(239,68,68,0.15); border-radius: 100px; font-size: 11px; font-weight: 700; color: var(--danger); letter-spacing: 0.05em; flex-shrink: 0; }
    .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--danger); animation: pulse 1.5s infinite; }
    .header-icon-btn {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text); cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      font-size: 14px; padding: 0; flex-shrink: 0;
      transition: transform 0.15s, background 0.2s;
    }
    .header-icon-btn:active { transform: scale(0.9); background: var(--surface-3); }

    .search-wrap { position: relative; display: flex; align-items: center; }
    .search-icon { position: absolute; left: 14px; width: 18px; height: 18px; color: var(--text-2); pointer-events: none; }
    #search { width: 100%; padding: 12px 44px 12px 42px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 100px; color: var(--text); font-size: 16px; outline: none; transition: all 0.2s; }
    #search:focus { background: var(--surface-3); border-color: var(--accent); box-shadow: 0 0 0 3px rgba(139,92,246,0.15); }
    #search::placeholder { color: var(--text-2); }
    #clear-search { position: absolute; right: 8px; width: 28px; height: 28px; border-radius: 50%; background: var(--surface-3); border: none; color: var(--text-2); cursor: pointer; display: none; align-items: center; justify-content: center; font-size: 16px; line-height: 1; }
    #clear-search.visible { display: flex; }

    #content { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px); -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    #stats-line { padding: 12px var(--pad-x) 0; font-size: 13px; color: var(--text-2); }
    #stats-line strong { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }

    #channel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(160px, 42vw), 1fr));
      gap: var(--gap);
      padding: var(--pad-x);
    }
    @media (min-width: 900px) { #channel-grid { grid-template-columns: repeat(4, 1fr); padding: 12px 24px; } }
    @media (min-width: 1200px) { #channel-grid { grid-template-columns: repeat(5, 1fr); } }

    .channel-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; cursor: pointer; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; animation: fadeIn 0.35s cubic-bezier(0.4,0,0.2,1); position: relative; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .channel-card:active { transform: scale(0.97); }
    .channel-card.active { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(139,92,246,0.3), 0 0 24px rgba(139,92,246,0.2); }
    .card-thumb { aspect-ratio: 16/10; background: linear-gradient(135deg, var(--surface-2), var(--surface)); display: flex; align-items: center; justify-content: center; position: relative; padding: 20px; overflow: hidden; }
    .card-thumb::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(139,92,246,0.06), transparent 70%); pointer-events: none; }
    .card-logo { max-width: 80%; max-height: 80%; object-fit: contain; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.4)); position: relative; z-index: 1; }
    .card-badge { position: absolute; top: 8px; left: 8px; padding: 3px 8px; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); border-radius: 6px; font-size: 10px; font-weight: 700; color: white; font-variant-numeric: tabular-nums; z-index: 2; }
    .card-star { position: absolute; top: 6px; right: 6px; width: 34px; height: 34px; border-radius: 50%; background: rgba(0,0,0,0.55); backdrop-filter: blur(10px); border: none; color: rgba(255,255,255,0.7); font-size: 17px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s, color 0.15s, background 0.15s; padding: 0; line-height: 1; z-index: 2; }
    .card-star:active { transform: scale(0.85); }
    .card-star.active { color: var(--star); background: rgba(251,191,36,0.25); }
    .card-info { padding: 10px 12px 12px; }
    .card-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; line-height: 1.3; }
    .card-category { font-size: 11px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; }

    .skeleton { background: linear-gradient(90deg, var(--surface) 0%, var(--surface-2) 50%, var(--surface) 100%); background-size: 200% 100%; animation: shimmer 1.5s infinite; border-radius: var(--radius-md); }
    .skeleton-card { aspect-ratio: 16/10; }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    .empty { grid-column: 1 / -1; text-align: center; padding: 40px 24px; color: var(--text-2); }
    .empty-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.6; }
    .empty h3 { margin: 0 0 8px; color: var(--text); font-size: 16px; }
    .empty p { margin: 0; font-size: 13px; line-height: 1.5; }

    .diag { margin: 16px 0; padding: 12px; background: var(--surface-2); border-radius: 12px; text-align: left; font-size: 12px; }
    .diag-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); }
    .diag-row:last-child { border-bottom: none; }
    .diag-dot { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
    .diag-row.ok .diag-dot { background: rgba(16,185,129,0.2); color: var(--success); }
    .diag-row.fail .diag-dot { background: rgba(239,68,68,0.2); color: var(--danger); }
    .diag-host { flex: 1; font-family: monospace; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .diag-msg { font-size: 11px; color: var(--text-2); flex-shrink: 0; }
    .diag-row.fail .diag-msg { color: var(--danger); }
    .retry-btn { margin-top: 12px; padding: 12px 24px; background: var(--gradient); border: none; border-radius: 100px; color: white; font-weight: 600; font-size: 14px; cursor: pointer; }
    .retry-btn:active { transform: scale(0.95); }
    .diag-hint { font-size: 11px; color: var(--text-2); margin-top: 12px; line-height: 1.5; }

    #loading-more { padding: 24px; display: flex; justify-content: center; }
    #loading-more.hidden { display: none; }
    .spinner { width: 32px; height: 32px; border: 3px solid var(--surface-3); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; height: calc(var(--nav-h) + var(--safe-bottom)); padding-bottom: var(--safe-bottom); background: rgba(10,10,15,0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--border); display: flex; align-items: center; z-index: 50; }
    .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: none; border: none; color: var(--text-2); cursor: pointer; padding: 8px; height: 100%; transition: color 0.2s; position: relative; }
    .nav-btn.active { color: var(--text); }
    .nav-btn svg { width: 24px; height: 24px; transition: transform 0.2s; }
    .nav-btn.active svg { transform: scale(1.1); filter: drop-shadow(0 0 6px rgba(139,92,246,0.6)); }
    .nav-btn span:not(.nav-badge) { font-size: 11px; font-weight: 500; }
    .nav-btn.active::after { content: ''; position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
    .nav-badge { position: absolute; top: 6px; right: calc(50% - 22px); min-width: 18px; height: 18px; padding: 0 5px; background: var(--gradient); border-radius: 100px; color: white; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; box-shadow: 0 2px 6px rgba(139,92,246,0.4); }
    .nav-badge.hidden { display: none; }

    #player-modal { position: fixed; inset: 0; width: 100vw; height: var(--app-height); background: #000; z-index: 200; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.42s cubic-bezier(0.32,0.72,0,1); will-change: transform; }
    #player-modal.open { transform: translateY(0); }

    .player-back {
      position: absolute;
      top: calc(12px + var(--safe-top));
      left: calc(12px + var(--safe-left));
      width: 44px; height: 44px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.12);
      color: white;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      padding: 0; line-height: 1;
      z-index: 10;
      transition: transform 0.15s, background 0.2s;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    .player-back:active { transform: scale(0.9); background: rgba(0,0,0,0.8); }

    #player-top { position: absolute; top: 0; left: 0; right: 0; padding: calc(12px + var(--safe-top)) calc(16px + var(--safe-right)) 16px calc(68px + var(--safe-left)); background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent); display: flex; align-items: center; gap: 12px; z-index: 2; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
    #player-modal.show-controls #player-top { opacity: 1; pointer-events: auto; }
    .close-btn, .player-action { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,0.14); backdrop-filter: blur(20px); border: none; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s, transform 0.15s; flex-shrink: 0; font-size: 18px; line-height: 1; padding: 0; }
    .close-btn:active, .player-action:active { transform: scale(0.9); background: rgba(255,255,255,0.22); }
    .player-action.active { background: rgba(251,191,36,0.3); color: var(--star); }
    .player-title-info { flex: 1; min-width: 0; color: white; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    .player-num { font-size: 11px; color: rgba(255,255,255,0.7); font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: 0.05em; }
    .player-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    #player-video-wrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; position: relative; overflow: hidden; min-height: 0; }
    #video { width: 100%; height: 100%; object-fit: contain; background: #000; transition: transform 0.2s; -webkit-user-select: none; user-select: none; }
    #video.fit-fill { object-fit: cover; }
    #video.fit-zoom { object-fit: cover; transform: scale(1.2); }

    #player-bottom { position: absolute; bottom: 0; left: 0; right: 0; padding: 16px calc(16px + var(--safe-right)) calc(16px + var(--safe-bottom)) calc(16px + var(--safe-left)); background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); display: flex; gap: 8px; z-index: 2; opacity: 0; pointer-events: none; transition: opacity 0.3s; justify-content: center; flex-wrap: wrap; }
    #player-modal.show-controls #player-bottom { opacity: 1; pointer-events: auto; }
    .p-ctrl { padding: 10px 16px; background: rgba(255,255,255,0.15); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.12); border-radius: 100px; color: white; font-size: 13px; font-weight: 500; cursor: pointer; transition: background 0.2s, transform 0.15s; display: flex; align-items: center; gap: 6px; }
    .p-ctrl:active { transform: scale(0.95); background: rgba(255,255,255,0.25); }
    .p-ctrl.active { background: var(--gradient); border-color: transparent; }
    #player-status { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; text-align: center; padding: 24px; font-size: 14px; max-width: 85%; display: none; background: rgba(0,0,0,0.75); border-radius: var(--radius-md); backdrop-filter: blur(20px); line-height: 1.5; z-index: 3; }
    #player-status.visible { display: block; }
    #player-status button { margin-top: 12px; padding: 10px 18px; background: var(--gradient); border: none; border-radius: 100px; color: white; font-weight: 600; font-size: 13px; cursor: pointer; }
    #player-loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; z-index: 3; }
    #player-loading.visible { display: block; }
    #player-loading .spinner { width: 48px; height: 48px; border-width: 4px; }
    #unmute-overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 4; cursor: pointer; }
    #unmute-overlay.visible { display: flex; }
    #unmute-overlay .unmute-icon { width: 80px; height: 80px; border-radius: 50%; background: var(--gradient); display: flex; align-items: center; justify-content: center; font-size: 32px; color: white; box-shadow: 0 8px 32px rgba(139,92,246,0.5); animation: pulse 2s infinite; }

    #backup-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: 400; display: none; align-items: center; justify-content: center; padding: 24px; }
    #backup-modal.visible { display: flex; }
    .modal-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 24px; width: 100%; max-width: 340px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
    .modal-card h3 { margin: 0 0 6px; font-size: 16px; color: var(--text); }
    .modal-card .modal-sub { margin: 0 0 18px; font-size: 12px; color: var(--text-2); line-height: 1.4; }
    .modal-btn { display: block; width: 100%; padding: 14px 16px; margin-bottom: 8px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 14px; font-weight: 500; cursor: pointer; text-align: center; transition: background 0.2s, transform 0.15s; }
    .modal-btn:active { background: var(--surface-3); transform: scale(0.97); }
    .modal-btn.cancel { background: transparent; border-color: transparent; color: var(--text-2); margin-bottom: 0; }
    .modal-status { font-size: 11px; color: var(--success); margin-top: 12px; min-height: 14px; }

    #toast { position: fixed; bottom: calc(var(--nav-h) + var(--safe-bottom) + 20px); left: 50%; transform: translateX(-50%) translateY(20px); padding: 12px 20px; background: rgba(30,30,45,0.96); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 100px; color: var(--text); font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity 0.3s, transform 0.3s; z-index: 500; display: flex; align-items: center; gap: 8px; white-space: nowrap; box-shadow: 0 4px 20px rgba(0,0,0,0.4); max-width: calc(100vw - 32px); }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.star-toast { color: var(--star); }

    #content::-webkit-scrollbar { width: 4px; }
    #content::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 2px; }

    @media (max-width: 360px) {
      :root { --nav-h: 64px; }
      #app-header { padding: calc(8px + var(--safe-top)) var(--pad-x) 8px; }
      .brand-row { margin-bottom: 8px; gap: 6px; }
      .brand h1 { font-size: 15px; }
      .live-indicator { padding: 3px 8px; font-size: 10px; }
      .header-icon-btn { width: 28px; height: 28px; font-size: 12px; }
      #search { padding: 10px 40px 10px 38px; font-size: 15px; }
      .card-info { padding: 8px 10px 10px; }
      .card-name { font-size: 12px; }
      .card-category { font-size: 10px; }
      .card-star { width: 30px; height: 30px; font-size: 15px; }
      .player-back { width: 40px; height: 40px; }
      #player-top { padding-left: calc(60px + var(--safe-left)); }
      .p-ctrl { padding: 8px 12px; font-size: 11px; }
    }

    @media (min-width: 900px) {
      #app-header { padding: calc(16px + var(--safe-top)) 24px 16px; }
      #stats-line { padding: 12px 24px 0; }
    }
  </style>
</head>
<body>

  <div id="app">
    <header id="app-header">
      <div class="brand-row">
        <div class="brand"><span class="brand-dot"></span><h1>TV LIVE</h1></div>
        <div class="header-actions">
          <div class="live-indicator"><span class="live-dot"></span><span>IN DIRETTA</span></div>
          <button class="header-icon-btn" id="backup-btn" aria-label="Backup preferiti" title="Backup preferiti">💾</button>
        </div>
      </div>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="search" id="search" placeholder="Cerca canale…" autocomplete="off" inputmode="search" enterkeyhint="search">
        <button id="clear-search" aria-label="Cancella">×</button>
      </div>
    </header>

    <main id="content">
      <div id="stats-line">Caricamento…</div>
      <div id="channel-grid"></div>
      <div id="loading-more"><div class="spinner"></div></div>
    </main>

    <nav id="bottom-nav" role="tablist">
      <button class="nav-btn active" data-mode="all" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect></svg>
        <span>Canali</span>
      </button>
      <button class="nav-btn" data-mode="favorites" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
        <span>Preferiti</span>
        <span class="nav-badge hidden" id="fav-badge">0</span>
      </button>
    </nav>

    <div id="player-modal" role="dialog" aria-modal="true">
      <button class="player-back" id="player-back" aria-label="Indietro">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="22" height="22"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <div id="player-top">
        <div class="player-title-info">

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script>
  (function () {
    'use strict';

    if (!Promise.allSettled) {
      Promise.allSettled = function (promises) {
        return Promise.all(promises.map(function (p) {
          return Promise.resolve(p).then(
            function (v) { return { status: 'fulfilled', value: v }; },
            function (e) { return { status: 'rejected', reason: e }; }
          );
        }));
      };
    }
    if (!String.prototype.normalize) {
      String.prototype.normalize = function () { return this; };
    }

    var tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
    var IS_TG_MINI = !!(tg && tg.initData);
    var UA = navigator.userAgent;
    var IS_TG_BROWSER = /Telegram/i.test(UA);
    var IS_IOS = /iPad|iPhone|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var IS_ANDROID = /Android/i.test(UA);
    var HAS_CLOUD_STORAGE = !!(IS_TG_MINI && tg.CloudStorage);

    function updateAppHeight() {
      var vv = window.visualViewport;
      var h = vv ? vv.height : window.innerHeight;
      if (h && h > 0) {
        document.documentElement.style.setProperty('--app-height', Math.round(h) + 'px');
      }
    }
    updateAppHeight();
    window.addEventListener('resize', updateAppHeight);
    window.addEventListener('orientationchange', function () { setTimeout(updateAppHeight, 150); });
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', updateAppHeight);
    }
    if (IS_TG_MINI && tg.onEvent) {
      try { tg.onEvent('viewportChanged', updateAppHeight); } catch (e) {}
    }

    if (IS_TG_MINI) {
      try { tg.ready(); } catch (e) {}
      try { tg.expand(); } catch (e) {}
      try { if (tg.setHeaderColor) tg.setHeaderColor('#0a0a0f'); } catch (e) {}
      try { if (tg.setBackgroundColor) tg.setBackgroundColor('#0a0a0f'); } catch (e) {}
      try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
    }

    // Playlist verificate: rimosse le 3 rotte (forgejo, IPTVRU2026 inesistente, Free-TV test stream)
    var PLAYLISTS = [
      'https://iptv-org.github.io/iptv/index.m3u',
      'https://iptv-org.github.io/iptv/channels/it.m3u',
      'https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/plutotv_all.m3u',
      'https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/plutotv_it.m3u',
      'https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/samsungtvplus_all.m3u',
      'https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/plex_all.m3u',
      'https://raw.githubusercontent.com/BuddyChewChew/app-m3u-generator/main/playlists/roku_all.m3u',
    ];

    var FETCH_TIMEOUT = 15000;
    var BATCH_SIZE = 60;
    var FAVORITES_KEY = 'iptv_favorites_v1';

    var CLOUD_KEY_PREFIX = 'tvlive_fav_';
    var CLOUD_KEY_COUNT = 'tvlive_fav_n';
    var CLOUD_KEY_LEGACY = 'tv_live_favorites_v1';
    var CLOUD_CHUNK_SIZE = 4000;
    var cloudChunkCount = 0;

    var PLACEHOLDER_LOGO = 'data:image/svg+xml,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"><rect width="60" height="60" fill="#2a2a3d"/><text x="30" y="36" text-anchor="middle" fill="#8b8b9e" font-size="14" font-family="sans-serif" font-weight="bold">TV</text></svg>'
    );

    var allChannels = [];
    var filteredChannels = [];
    var favorites = {};
    var currentMode = 'all';
    var currentQuery = '';
    var displayedCount = 0;
    var hls = null;
    var activeUrl = null;
    var activeChannel = null;
    var fitMode = 'fit';
    var scrollObserver = null;
    var toastTimeout;
    var controlsTimeout;
    var lastLoadLog = [];

    function $(id) { return document.getElementById(id); }
    var contentEl = $('content');
    var gridEl = $('channel-grid');
    var loadingMoreEl = $('loading-more');
    var statsLineEl = $('stats-line');
    var searchInput = $('search');
    var clearSearchBtn = $('clear-search');
    var favBadgeEl = $('fav-badge');
    var playerModal = $('player-modal');
    var videoEl = $('video');
    var playerNumEl = $('player-num');
    var playerNameEl = $('player-name');
    var playerStarBtn = $('player-star');
    var playerBackBtn = $('player-back');
    var playerLoadingEl = $('player-loading');
    var playerStatusEl = $('player-status');
    var unmuteOverlay = $('unmute-overlay');
    var toastEl = $('toast');
    var backupModal = $('backup-modal');
    var backupBtn = $('backup-btn');
    var importFileInput = $('import-file');
    var backupStatusEl = $('backup-status');

    function normalize(s) {
      if (!s) return '';
      try { s = s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }
      catch (e) { s = s.toLowerCase(); }
      return s;
    }
    function haptic(style) {
      if (IS_TG_MINI && tg.HapticFeedback) {
        try { tg.HapticFeedback.impactOccurred(style || 'light'); return; } catch (e) {}
      }
      if (navigator.vibrate) navigator.vibrate(8);
    }
    function showToast(msg, isStar) {
      toastEl.textContent = msg;
      toastEl.className = 'show' + (isStar ? ' star-toast' : '');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(function () { toastEl.classList.remove('show'); }, 2500);
    }

    // ============================================================
    // PREFERITI: localStorage + Telegram CloudStorage (chunked) + file
    // ============================================================
    function loadFavoritesFromLocal() {
      try {
        var raw = localStorage.getItem(FAVORITES_KEY);
        if (raw) {
          var arr = JSON.parse(raw);
          if (Array.isArray(arr)) {
            for (var i = 0; i < arr.length; i++) favorites[arr[i]] = true;
          }
        }
      } catch (e) { console.warn('Favorites load:', e); }
    }

    function persistLocal() {
      try { localStorage.setItem(FAVORITES_KEY, JSON.stringify(Object.keys(favorites))); }
      catch (e) { console.warn('Favorites save:', e); }
    }

    function persistCloud(callback) {
      if (!HAS_CLOUD_STORAGE) { if (callback) callback(); return; }
      try {
        var json = JSON.stringify(Object.keys(favorites));
        var chunks = [];
        for (var i = 0; i < json.length; i += CLOUD_CHUNK_SIZE) {
          chunks.push(json.substring(i, i + CLOUD_CHUNK_SIZE));
        }
        if (chunks.length === 0) chunks.push('[]');

        var toSet = {};
        toSet[CLOUD_KEY_COUNT] = String(chunks.length);
        for (var j = 0; j < chunks.length; j++) {
          toSet[CLOUD_KEY_PREFIX + j] = chunks[j];
        }

        tg.CloudStorage.setItems(toSet, function (err) {
          if (err) {
            console.warn('Cloud save error:', err);
            showToast('⚠️ Salvataggio cloud fallito');
            if (callback) callback();
            return;
          }
          if (cloudChunkCount > chunks.length) {
            var toRemove = [];
            for (var k = chunks.length; k < cloudChunkCount; k++) {
              toRemove.push(CLOUD_KEY_PREFIX + k);
            }
            if (toRemove.length > 0) {
              tg.CloudStorage.removeItems(toRemove, function () {});
            }
          }
          cloudChunkCount = chunks.length;
          if (callback) callback();
        });
      } catch (e) {
        console.warn('Cloud save exception:', e);
        showToast('⚠️ Errore salvataggio cloud');
        if (callback) callback();
      }
    }

    function mergeCloudIntoLocal() {
      if (!HAS_CLOUD_STORAGE) {
        if (IS_TG_MINI) {
          console.warn('In Telegram ma CloudStorage non disponibile. Apri come Mini App vera (menu bot).');
        }
        return;
      }
      try {
        tg.CloudStorage.getItem(CLOUD_KEY_COUNT, function (err, countStr) {
          if (err) { console.warn('Cloud count error:', err); return; }
          var count = Number(countStr) || 0;

          if (count === 0) {
            tg.CloudStorage.getItem(CLOUD_KEY_LEGACY, function (err2, legacyVal) {
              if (!err2 && legacyVal) {
                try {
                  var arr = JSON.parse(legacyVal);
                  if (Array.isArray(arr)) {
                    for (var i = 0; i < arr.length; i++) favorites[arr[i]] = true;
                    persistLocal();
                    updateFavBadge();
                    if (allChannels.length > 0) applyFilters();
                    persistCloud();
                    return;
                  }
                } catch (e) {}
              }
              if (Object.keys(favorites).length > 0) persistCloud();
            });
            return;
          }

          var chunkKeys = [];
          for (var i = 0; i < count; i++) chunkKeys.push(CLOUD_KEY_PREFIX + i);
          tg.CloudStorage.getItems(chunkKeys, function (err3, values) {
            if (err3) { console.warn('Cloud chunks error:', err3); return; }
            var json = '';
            for (var j = 0; j < chunkKeys.length; j++) {
              json += (values[chunkKeys[j]] || '');
            }
            try {
              var arr = JSON.parse(json);
              var changed = false;
              if (Array.isArray(arr)) {
                for (var k = 0; k < arr.length; k++) {
                  if (typeof arr[k] === 'string' && !favorites[arr[k]]) {
                    favorites[arr[k]] = true;
                    changed = true;
                  }
                }
              }
              cloudChunkCount = count;
              if (changed) {
                persistLocal();
                updateFavBadge();
                if (allChannels.length > 0) applyFilters();
              }
            } catch (e) {
              console.warn('Cloud parse error:', e);
            }
          });
        });
      } catch (e) {
        console.warn('Cloud load exception:', e);
      }
    }

    function saveFavorites() {
      persistLocal();
      persistCloud();
    }

    function isFav(url) { return !!favorites[url]; }
    function toggleFav(url) {
      if (favorites[url]) { delete favorites[url]; saveFavorites(); return false; }
      favorites[url] = true; saveFavorites(); return true;
    }

    // ============================================================
    // EXPORT / IMPORT FILE
    // ============================================================
    function openBackupModal() {
      backupStatusEl.textContent = '';
      backupModal.classList.add('visible');
      haptic();
    }
    function closeBackupModal() {
      backupModal.classList.remove('visible');
    }

    function exportFavorites() {
      var keys = Object.keys(favorites);
      if (keys.length === 0) {
        backupStatusEl.textContent = '⚠️ Nessun preferito da esportare';
        backupStatusEl.style.color = 'var(--danger)';
        return;
      }
      var data = {
        app: 'TV LIVE',
        version: 1,
        exportedAt: new Date().toISOString(),
        count: keys.length,
        favorites: keys
      };
      try {
        var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'tv-live-preferiti-' + new Date().toISOString().slice(0, 10) + '.json';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
        backupStatusEl.style.color = 'var(--success)';
        backupStatusEl.textContent = '✅ File esportato (' + keys.length + ' preferiti)';
        haptic();
      } catch (e) {
        backupStatusEl.style.color = 'var(--danger)';
        backupStatusEl.textContent = '❌ Esportazione non riuscita';
      }
    }

    function triggerImport() {
      importFileInput.value = '';
      importFileInput.click();
    }

    importFileInput.addEventListener('change', function (e) {
      var file = e.target.files && e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (ev) {
        try {
          var data = JSON.parse(ev.target.result);
          var arr = data && data.favorites ? data.favorites : data;
          if (!Array.isArray(arr)) throw new Error('Formato non valido');
          var added = 0;
          for (var i = 0; i < arr.length; i++) {
            if (typeof arr[i] === 'string' && !favorites[arr[i]]) {
              favorites[arr[i]] = true;
              added++;
            }
          }
          saveFavorites();
          updateFavBadge();
          if (allChannels.length > 0) applyFilters();
          backupStatusEl.style.color = 'var(--success)';
          backupStatusEl.textContent = '✅ Importati ' + added + ' nuovi preferiti (totale ' + Object.keys(favorites).length + ')';
          haptic();
        } catch (err) {
          backupStatusEl.style.color = 'var(--danger)';
          backupStatusEl.textContent = '❌ File non valido';
        }
      };
      reader.readAsText(file);
    });

    backupBtn.addEventListener('click', openBackupModal);
    $('cancel-backup').addEventListener('click', closeBackupModal);
    $('export-btn').addEventListener('click', exportFavorites);
    $('import-btn').addEventListener('click', triggerImport);
    backupModal.addEventListener('click', function (e) {
      if (e.target === backupModal) closeBackupModal();
    });

    // ============================================================
    // PARSER M3U
    // ============================================================
    function parseM3U(text) {
      if (!text) return [];
      var lines = text.split('\n');
      var out = [];
      var cur = null;
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) continue;
        if (line.indexOf('#EXTINF:') === 0) {
          var info = line.substring(8);
          var commaIdx = info.indexOf(',');
          var attrs = commaIdx !== -1 ? info.substring(0, commaIdx) : info;
          var name = commaIdx !== -1 ? info.substring(commaIdx + 1).trim() : 'Sconosciuto';
          var logoMatch = attrs.match(/tvg-logo="([^"]*)"/);
          var groupMatch = attrs.match(/group-title="([^"]*)"/);
          cur = {
            name: name,
            url: '',
            logo: logoMatch ? logoMatch[1] : '',
            group: (groupMatch ? groupMatch[1] : 'Generale').trim() || 'Generale'
          };
        } else if (line.charAt(0) !== '#' && cur) {
          cur.url = line;
          if (cur.url && cur.name) out.push(cur);
          cur = null;
        }
      }
      return out;
    }

    function loadText(url, timeoutMs) {
      timeoutMs = timeoutMs || FETCH_TIMEOUT;
      return new Promise(function (resolve, reject) {
        var done = false;
        var timer = setTimeout(function () {
          if (done) return;
          done = true;
          reject(new Error('Timeout'));
        }, timeoutMs);

        try {
          var xhr = new XMLHttpRequest();
          xhr.open('GET', url, true);
          xhr.timeout = timeoutMs;
          xhr.onload = function () {
            if (done) return;
            done = true;
            clearTimeout(timer);
            if (xhr.status >= 200 && xhr.status < 300) {
              resolve(xhr.responseText || '');
            } else {
              reject(new Error('HTTP ' + xhr.status));
            }
          };
          xhr.onerror = function () {
            if (done) return;
            done = true;
            clearTimeout(timer);
            reject(new Error('CORS/rete'));
          };
          xhr.ontimeout = function () {
            if (done) return;
            done = true;
            clearTimeout(timer);
            reject(new Error('Timeout'));
          };
          xhr.onabort = function () {
            if (done) return;
            done = true;
            clearTimeout(timer);
            reject(new Error('Annullato'));
          };
          xhr.send();
        } catch (e) {
          if (!done) {
            done = true;
            clearTimeout(timer);
            reject(e);
          }
        }
      });
    }

    function loadPlaylists() {
      showSkeletons();
      statsLineEl.innerHTML = 'Caricamento playlist…';
      lastLoadLog = [];

      var promises = PLAYLISTS.map(function (url) {
        return loadText(url, FETCH_TIMEOUT).then(function (text) {
          var chs = parseM3U(text);
          lastLoadLog.push({ url: url, ok: true, count: chs.length });
          return chs;
        }).catch(function (err) {
          var msg = (err && err.message) ? err.message : String(err);
          lastLoadLog.push({ url: url, ok: false, error: msg });
          return [];
        });
      });

      Promise.all(promises).then(function (arrays) {
        var merged = [];
        for (var i = 0; i < arrays.length; i++) {
          for (var j = 0; j < arrays[i].length; j++) merged.push(arrays[i][j]);
        }

        var seen = {};
        var deduped = [];
        for (var k = 0; k < merged.length; k++) {
          var ch = merged[k];
          var key = ch.url.toLowerCase().split('?')[0].replace(/\/+$/, '');
          if (!seen[key]) { seen[key] = true; deduped.push(ch); }
        }

        allChannels = deduped.map(function (c, idx) { c.num = idx + 1; return c; });

        if (allChannels.length === 0) {
          showLoadError();
          return;
        }

        // Log silenzioso delle playlist non caricate; avvisa solo se il totale è davvero basso
        var fails = lastLoadLog.filter(function (l) { return !l.ok; });
        if (fails.length > 0) {
          console.warn('Playlist non caricate:', fails.map(function (f) { return f.url; }));
        }
        if (fails.length > 0 && allChannels.length < 100) {
          showToast('⚠️ Solo ' + allChannels.length + ' canali caricati');
        }

        applyFilters();
      }).catch(function (err) {
        console.error('loadPlaylists:', err);
        showLoadError();
      });
    }

    function showSkeletons() {
      gridEl.innerHTML = '';
      for (var i = 0; i < 8; i++) {
        var sk = document.createElement('div');
        sk.className = 'skeleton skeleton-card';
        gridEl.appendChild(sk);
      }
    }

    function showLoadError() {
      var html = '<div class="empty">';
      html += '<div class="empty-icon">⚠️</div>';
      html += '<h3>Impossibile caricare i canali</h3>';
      html += '<p>Nessuna playlist ha risposto. Diagnostica:</p>';
      html += '<div class="diag">';
      for (var i = 0; i < lastLoadLog.length; i++) {
        var l = lastLoadLog[i];
        var host = l.url.replace(/^https?:\/\//, '').split('/')[0];
        html += '<div class="diag-row ' + (l.ok ? 'ok' : 'fail') + '">';
        html += '<span class="diag-dot">' + (l.ok ? '✓' : '✕') + '</span>';
        html += '<span class="diag-host">' + host + '</span>';
        html += '<span class="diag-msg">' + (l.ok ? l.count + ' canali' : l.error) + '</span>';
        html += '</div>';
      }
      html += '</div>';
      html += '<button class="retry-btn" id="retry-load">🔄 Riprova</button>';
      html += '<p class="diag-hint">Se il problema persiste, apri il link direttamente in Safari/Chrome: alcuni WebView di Telegram bloccano richieste cross-origin.</p>';
      html += '</div>';
      gridEl.innerHTML = html;

      var retry = $('retry-load');
      if (retry) retry.addEventListener('click', loadPlaylists);
    }

    function applyFilters() {
      var source = [];
      if (currentMode === 'favorites') {
        for (var i = 0; i < allChannels.length; i++) {
          if (isFav(allChannels[i].url)) source.push(allChannels[i]);
        }
      } else {
        source = allChannels;
      }

      var q = normalize(currentQuery);
      filteredChannels = [];
      for (var k = 0; k < source.length; k++) {
        var ch = source[k];
        if (q && normalize(ch.name).indexOf(q) === -1 && normalize(ch.group).indexOf(q) === -1) continue;
        filteredChannels.push(ch);
      }

      displayedCount = 0;
      gridEl.innerHTML = '';
      updateStats();
      updateFavBadge();

      if (filteredChannels.length === 0) {
        renderEmpty();
        loadingMoreEl.classList.add('hidden');
        return;
      }
      loadingMoreEl.classList.remove('hidden');
      renderNextBatch();
    }

    function updateStats() {
      var total = allChannels.length;
      var filtering = currentQuery || currentMode === 'favorites';
      if (filtering) {
        statsLineEl.innerHTML = '<strong>' + filteredChannels.length.toLocaleString('it-IT') + '</strong> risultati' +
          (currentMode === 'favorites' ? ' nei preferiti' : ' su ' + total.toLocaleString('it-IT'));
      } else {
        statsLineEl.innerHTML = '<strong>' + total.toLocaleString('it-IT') + '</strong> canali disponibili';
      }
    }

    function updateFavBadge() {
      var count = 0;
      for (var i = 0; i < allChannels.length; i++) {
        if (isFav(allChannels[i].url)) count++;
      }
      if (count > 0) {
        favBadgeEl.textContent = count > 999 ? '999+' : count;
        favBadgeEl.classList.remove('hidden');
      } else {
        favBadgeEl.classList.add('hidden');
      }
    }

    function renderEmpty() {
      var isFavMode = currentMode === 'favorites';
      var hasFilter = currentQuery;
      var icon = '📺', title = 'Nessun canale trovato', sub = 'Prova a modificare la ricerca.';
      if (isFavMode && !hasFilter) {
        icon = '⭐'; title = 'Nessun preferito';
        sub = 'Tocca la stella ★ su un canale per aggiungerlo qui.';
      } else if (isFavMode) {
        icon = '🔍'; title = 'Nessun preferito trovato';
        sub = 'Modifica la ricerca.';
      }
      gridEl.innerHTML = '<div class="empty"><div class="empty-icon">' + icon + '</div><h3>' + title + '</h3><p>' + sub + '</p></div>';
    }

    function renderNextBatch() {
      var start = displayedCount;
      var end = Math.min(start + BATCH_SIZE, filteredChannels.length);
      var frag = document.createDocumentFragment();
      for (var i = start; i < end; i++) {
        frag.appendChild(createCard(filteredChannels[i]));
      }
      gridEl.appendChild(frag);
      displayedCount = end;
      if (displayedCount >= filteredChannels.length) {
        loadingMoreEl.classList.add('hidden');
      } else {
        loadingMoreEl.classList.remove('hidden');
      }
    }

    function setupInfiniteScroll() {
      if (scrollObserver) scrollObserver.disconnect();
      if (typeof IntersectionObserver === 'undefined') {
        contentEl.addEventListener('scroll', function () {
          if (contentEl.scrollTop + contentEl.clientHeight >= contentEl.scrollHeight - 500) {
            if (displayedCount < filteredChannels.length) renderNextBatch();
          }
        });
        return;
      }
      scrollObserver = new IntersectionObserver(function (entries) {
        if (entries[0].isIntersecting && displayedCount < filteredChannels.length) {
          renderNextBatch();
        }
      }, { rootMargin: '400px' });
      scrollObserver.observe(loadingMoreEl);
    }

    function createCard(ch) {
      var fav = isFav(ch.url);
      var card = document.createElement('div');
      card.className = 'channel-card' + (ch.url === activeUrl ? ' active' : '');
      card.setAttribute('data-url', ch.url);

      var thumb = document.createElement('div');
      thumb.className = 'card-thumb';

      var logo = document.createElement('img');
      logo.className = 'card-logo';
      logo.loading = 'lazy';
      logo.decoding = 'async';
      logo.src = ch.logo || PLACEHOLDER_LOGO;
      logo.onerror = function () { logo.src = PLACEHOLDER_LOGO; };
      logo.alt = '';

      var badge = document.createElement('span');
      badge.className = 'card-badge';
      badge.textContent = '#' + ch.num;

      var star = document.createElement('button');
      star.className = 'card-star' + (fav ? ' active' : '');
      star.textContent = fav ? '★' : '☆';
      star.type = 'button';

      thumb.appendChild(logo);
      thumb.appendChild(badge);
      thumb.appendChild(star);

      var info = document.createElement('div');
      info.className = 'card-info';
      var nameEl = document.createElement('div');
      nameEl.className = 'card-name';
      nameEl.textContent = ch.name;
      var catEl = document.createElement('div');
      catEl.className = 'card-category';
      catEl.textContent = ch.group;
      info.appendChild(nameEl);
      info.appendChild(catEl);

      card.appendChild(thumb);
      card.appendChild(info);

      card.addEventListener('click', function (e) {
        if (e.target === star || (e.target.parentNode === star)) return;
        openPlayer(ch, card);
      });

      star.addEventListener('click', function (e) {
        e.stopPropagation();
        var nowFav = toggleFav(ch.url);
        star.classList.toggle('active', nowFav);
        star.textContent = nowFav ? '★' : '☆';
        haptic();
        showToast(nowFav ? '★ Aggiunto ai preferiti' : 'Rimosso dai preferiti', nowFav);
        updateFavBadge();

        if (currentMode === 'favorites' && !nowFav) {
          card.style.transition = 'opacity 0.25s, transform 0.25s';
          card.style.opacity = '0';
          card.style.transform = 'scale(0.9)';
          setTimeout(function () {
            if (card.parentNode) card.parentNode.removeChild(card);
            updateStats();
            if (gridEl.children.length === 0) renderEmpty();
          }, 250);
        } else {
          updateStats();
        }
      });

      return card;
    }

    function openPlayer(ch, card) {
      haptic();
      activeChannel = ch;
      activeUrl = ch.url;

      playerNumEl.textContent = '#' + ch.num;
      playerNameEl.textContent = ch.name;
      updatePlayerStar();

      var actives = document.querySelectorAll('.channel-card.active');
      for (var i = 0; i < actives.length; i++) actives[i].classList.remove('active');
      if (card) card.classList.add('active');

      playerModal.classList.add('open');
      document.body.style.overflow = 'hidden';
      unmuteOverlay.classList.remove('visible');

      try { if (tg && tg.BackButton) tg.BackButton.show(); } catch (e) {}
      try { history.pushState({ modal: 'player' }, ''); } catch (e) {}

      playerLoadingEl.classList.add('visible');
      playerStatusEl.classList.remove('visible');

      startStream(ch.url);
      showPlayerControls();
    }

    function closePlayer(fromHistory) {
      playerModal.classList.remove('open');
      document.body.style.overflow = '';
      destroyStream();
      activeChannel = null;
      activeUrl = null;
      unmuteOverlay.classList.remove('visible');

      try { if (tg && tg.BackButton) tg.BackButton.hide(); } catch (e) {}

      // Esci da fullscreen se attivo
      try {
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(function () {});
        } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      } catch (e) {}

      // Esci da PiP se attivo
      try {
        if (document.pictureInPictureElement && document.exitPictureInPicture) {
          document.exitPictureInPicture().catch(function () {});
        }
        if (videoEl.webkitPresentationMode === 'picture-in-picture') {
          videoEl.webkitSetPresentationMode('inline');
        }
      } catch (e) {}

      if (!fromHistory && history.state && history.state.modal === 'player') {
        try { history.back(); } catch (e) {}
      }
    }

    function destroyStream() {
      if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
      try {
        videoEl.pause();
        videoEl.removeAttribute('src');
        videoEl.load();
      } catch (e) {}
    }

    function startStream(url) {
      destroyStream();
      playerLoadingEl.classList.add('visible');
      playerStatusEl.classList.remove('visible');
      try { videoEl.muted = false; videoEl.volume = 1; } catch (e) {}

      if (window.Hls && Hls.isSupported()) {
        try {
          hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true,
            maxBufferLength: 30
          });
          hls.loadSource(url);
          hls.attachMedia(videoEl);
          hls.on(Hls.Events.MANIFEST_PARSED, function () {
            playerLoadingEl.classList.remove('visible');
            tryAutoplay();
          });
          hls.on(Hls.Events.ERROR, function (event, data) {
            if (!data.fatal) return;
            if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
              showPlayerError('Errore di rete. Riprovo…', url);
              setTimeout(function () { if (hls) hls.startLoad(); }, 1500);
            } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
              showPlayerError('Errore media. Riprovo…', url);
              setTimeout(function () { if (hls) hls.recoverMediaError(); }, 1500);
            } else {
              playerLoadingEl.classList.remove('visible');
              showPlayerError('Canale non disponibile.', url);
              try { hls.destroy(); } catch (e) {}
              hls = null;
            }
          });
        } catch (e) {
          console.warn('Hls init:', e);
          playerLoadingEl.classList.remove('visible');
          showPlayerError('Errore riproduttore.', url);
        }
      } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
        videoEl.src = url;
        videoEl.addEventListener('loadeddata', function () {
          playerLoadingEl.classList.remove('visible');
          tryAutoplay();
        }, { once: true });
        videoEl.addEventListener('error', function () {
          playerLoadingEl.classList.remove('visible');
          showPlayerError('Canale non disponibile.', url);
        }, { once: true });
      } else {
        playerLoadingEl.classList.remove('visible');
        showPlayerError('HLS non supportato.', url);
      }
    }

    function tryAutoplay() {
      videoEl.muted = false;
      videoEl.volume = 1;
      var p = videoEl.play();
      if (p && p.catch) {
        p.catch(function () {
          videoEl.muted = true;
          var p2 = videoEl.play();
          if (p2 && p2.catch) {
            p2.catch(function () {
              showPlayerError('Tocca per avviare la riproduzione.', activeUrl);
            });
          }
          unmuteOverlay.classList.add('visible');
        });
      }
    }

    unmuteOverlay.addEventListener('click', function () {
      videoEl.muted = false;
      if (videoEl.volume === 0) videoEl.volume = 1;
      if (videoEl.paused) {
        var p = videoEl.play();
        if (p && p.catch) p.catch(function () {});
      }
      unmuteOverlay.classList.remove('visible');
      haptic();
      showToast('🔊 Audio attivato');
    });

    function showPlayerError(msg, url) {
      var html = msg + '<br><button type="button" id="open-ext">Apri nel browser</button>';
      playerStatusEl.innerHTML = html;
      playerStatusEl.classList.add('visible');
      var btn = $('open-ext');
      if (btn && url) {
        btn.addEventListener('click', function () {
          if (IS_TG_MINI && tg.openLink) {
            try { tg.openLink(url); return; } catch (e) {}
          }
          try { window.open(url, '_blank', 'noopener'); } catch (e) {}
        });
      }
    }

    function updatePlayerStar() {
      if (!activeChannel) return;
      var fav = isFav(activeChannel.url);
      playerStarBtn.classList.toggle('active', fav);
      playerStarBtn.textContent = fav ? '★' : '☆';
    }

    function showPlayerControls() {
      playerModal.classList.add('show-controls');
      clearTimeout(controlsTimeout);
      controlsTimeout = setTimeout(function () {
        if (!videoEl.paused) playerModal.classList.remove('show-controls');
      }, 3500);
    }

    function setFitMode(mode) {
      fitMode = mode;
      videoEl.classList.remove('fit-fill', 'fit-zoom');
      $('p-fit').classList.toggle('active', mode === 'fit');
      $('p-fill').classList.toggle('active', mode !== 'fit');
      if (mode === 'fill') videoEl.classList.add('fit-fill');
      else if (mode === 'zoom') videoEl.classList.add('fit-zoom');
    }

    // ============================================================
    // FULLSCREEN — versione robusta multi-piattaforma
    // ============================================================
    function toggleFullscreen() {
      haptic();

      // 1) iOS / Safari / WKWebView: native video fullscreen (funziona sempre)
      if (typeof videoEl.webkitEnterFullscreen === 'function' && typeof videoEl.webkitExitFullscreen === 'function') {
        try {
          if (videoEl.webkitDisplayingFullscreen) {
            videoEl.webkitExitFullscreen();
          } else {
            videoEl.webkitEnterFullscreen();
          }
          return;
        } catch (e) {
          console.warn('webkit fullscreen failed:', e);
        }
      }

      // 2) Standard Fullscreen API
      var isFs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);

      if (isFs) {
        try {
          if (document.exitFullscreen) document.exitFullscreen();
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
          else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
          else if (document.msExitFullscreen) document.msExitFullscreen();
        } catch (e) {}
        return;
      }

      // 3) Prova prima sul <video>, poi sul wrap
      var targets = [videoEl, $('player-video-wrap')];
      for (var i = 0; i < targets.length; i++) {
        var t = targets[i];
        if (!t) continue;
        try {
          if (t.requestFullscreen) {
            var p = t.requestFullscreen();
            if (p && p.catch) p.catch(function () {});
            return;
          }
          if (t.webkitRequestFullscreen) { t.webkitRequestFullscreen(); return; }
          if (t.mozRequestFullScreen) { t.mozRequestFullScreen(); return; }
          if (t.msRequestFullscreen) { t.msRequestFullscreen(); return; }
        } catch (e) {}
      }

      showToast('Schermo intero non supportato in questo contesto');
    }

    // ============================================================
    // PiP — supporto standard + Safari/iOS
    // ============================================================
    function togglePiP() {
      haptic();

      // Se PiP attivo → esci
      if (document.pictureInPictureElement) {
        try {
          var pexit = document.exitPictureInPicture();
          if (pexit && pexit.catch) pexit.catch(function () {});
        } catch (e) {}
        return;
      }

      // Safari / iOS: webkitSetPresentationMode
      if (typeof videoEl.webkitSetPresentationMode === 'function') {
        try {
          var mode = videoEl.webkitPresentationMode;
          if (mode === 'picture-in-picture') {
            videoEl.webkitSetPresentationMode('inline');
          } else {
            videoEl.webkitSetPresentationMode('picture-in-picture');
          }
          return;
        } catch (e) {
          console.warn('webkit PiP failed:', e);
        }
      }

      // Standard API (Chrome/Edge)
      if (!document.pictureInPictureEnabled) {
        showToast('Mini schermo non supportato');
        return;
      }

      if (videoEl.readyState < 2) {
        showToast('Attendi il caricamento del video');
        return;
      }

      if (videoEl.disablePictureInPicture) {
        showToast('Mini schermo non disponibile per questo video');
        return;
      }

      try {
        var pp = videoEl.requestPictureInPicture();
        if (pp && pp.catch) {
          pp.catch(function (err) {
            console.warn('PiP error:', err);
            showToast('Mini schermo non disponibile');
          });
        }
      } catch (e) {
        console.warn('PiP exception:', e);
        showToast('Mini schermo non disponibile');
      }
    }

    videoEl.addEventListener('click', function (e) {
      if (e.target !== videoEl) return;
      if (playerModal.classList.contains('show-controls')) playerModal.classList.remove('show-controls');
      else showPlayerControls();
    });

    var touchStartY = 0, touchStartTime = 0;
    videoEl.addEventListener('touchstart', function (e) {
      touchStartY = e.touches[0].clientY;
      touchStartTime = Date.now();
      showPlayerControls();
    }, { passive: true });

    videoEl.addEventListener('touchend', function (e) {
      if (document.fullscreenElement || videoEl.webkitDisplayingFullscreen) return;
      var dy = e.changedTouches[0].clientY - touchStartY;
      var dt = Date.now() - touchStartTime;
      if (dy > 120 && dt < 500) closePlayer();
    }, { passive: true });

    if (IS_TG_MINI && tg.BackButton) {
      try {
        tg.BackButton.onClick(function () {
          if (backupModal.classList.contains('visible')) { closeBackupModal(); return; }
          if (playerModal.classList.contains('open')) closePlayer();
          else tg.close();
        });
      } catch (e) {}
    }
    window.addEventListener('popstate', function () {
      if (playerModal.classList.contains('open')) closePlayer(true);
    });

    var searchTimeout;
    searchInput.addEventListener('input', function (e) {
      var val = e.target.value;
      clearSearchBtn.classList.toggle('visible', val.length > 0);
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(function () {
        currentQuery = val.trim();
        applyFilters();
      }, 250);
    });

    clearSearchBtn.addEventListener('click', function () {
      searchInput.value = '';
      currentQuery = '';
      clearSearchBtn.classList.remove('visible');
      applyFilters();
      searchInput.focus();
    });

    var navBtns = document.querySelectorAll('.nav-btn');
    for (var n = 0; n < navBtns.length; n++) {
      (function (btn) {
        btn.addEventListener('click', function () {
          if (btn.getAttribute('data-mode') === currentMode) return;
          currentMode = btn.getAttribute('data-mode');
          for (var m = 0; m < navBtns.length; m++) {
            navBtns[m].classList.toggle('active', navBtns[m] === btn);
            navBtns[m].setAttribute('aria-selected', navBtns[m] === btn ? 'true' : 'false');
          }
          haptic();
          contentEl.scrollTop = 0;
          applyFilters();
        });
      })(navBtns[n]);
    }

    playerBackBtn.addEventListener('click', function () { closePlayer(); });

    playerStarBtn.addEventListener('click', function () {
      if (!activeChannel) return;
      var nowFav = toggleFav(activeChannel.url);
      updatePlayerStar();
      haptic();
      showToast(nowFav ? '★ Aggiunto ai preferiti' : 'Rimosso dai preferiti', nowFav);
      updateFavBadge();
    });

    $('p-fit').addEventListener('click', function () { setFitMode('fit'); showPlayerControls(); });
    $('p-fill').addEventListener('click', function () {
      setFitMode(fitMode === 'fill' ? 'zoom' : 'fill');
      showPlayerControls();
    });

    $('p-pip').addEventListener('click', function () { togglePiP(); showPlayerControls(); });
    $('p-fs').addEventListener('click', function () { toggleFullscreen(); showPlayerControls(); });

    // ============================================================
    // INIT
    // ============================================================
    loadFavoritesFromLocal();
    updateFavBadge();
    mergeCloudIntoLocal();
    setupInfiniteScroll();
    loadPlaylists();
  })();
  </script>
</body>
</html>
