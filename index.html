<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">

<title>TV LIVE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#090a12;--surface:#151722;--surface2:#202333;--surface3:#2b3044;--text:#f5f6fb;--muted:#969caf;--accent:#8b5cf6;--pink:#ec4899;--gradient:linear-gradient(135deg,var(--accent),var(--pink));--border:#ffffff12;--star:#fbbf24;--red:#ff4d5c;--green:#10b981;--safe-t:env(safe-area-inset-top,0px);--tg-safe-t:0px;--tg-content-t:0px;--safe-b:env(safe-area-inset-bottom,0px);--tg-safe-b:0px;--tg-content-b:0px;--android-nav-fallback:0px;--nav-inset:max(var(--safe-b),var(--tg-safe-b),var(--android-nav-fallback));--safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);--nav-h:62px;--app-h:100dvh;--pad:clamp(12px,4vw,18px);--gap:clamp(8px,2.5vw,12px);--radius:17px}
@supports not(height:100dvh){:root{--app-h:100vh}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}html,body{margin:0;width:100%;height:var(--app-h);overflow:hidden;position:fixed;inset:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-touch-callout:none}button,input{font:inherit;color:inherit;touch-action:manipulation}button{cursor:pointer}#app{height:var(--app-h);display:flex;flex-direction:column;position:relative;overflow:hidden}
/* Intestazione e ricerca */
#app-header{flex-shrink:0;z-index:10;padding:calc(12px + max(var(--safe-t),var(--tg-safe-t)) + var(--tg-content-t)) var(--pad) 12px;background:#0a0b13ed;border-bottom:1px solid var(--border);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}.brand-row{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:12px}.brand{display:flex;align-items:center;gap:9px;min-width:0}.brand-dot,.live-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;animation:pulse 2s infinite}.brand-dot{background:var(--gradient);box-shadow:0 0 14px #8b5cf688}.brand h1{margin:0;font-size:clamp(16px,4.8vw,19px);font-weight:800;letter-spacing:-.04em;background:var(--gradient);background-clip:text;-webkit-background-clip:text;color:transparent}.header-actions{display:flex;align-items:center;gap:9px}.live-indicator{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:#ff4d5c1a;color:var(--red);font-size:10px;font-weight:800;letter-spacing:.07em}.live-dot{width:6px;height:6px;background:var(--red)}.header-icon-btn{width:36px;height:36px;border:1px solid var(--border);border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-size:15px;transition:.2s}.header-icon-btn:active{transform:scale(.9);background:var(--surface3)}.search-wrap{position:relative;display:flex;align-items:center}.search-icon{position:absolute;left:14px;width:18px;height:18px;color:var(--muted);pointer-events:none}#search{width:100%;padding:12px 44px 12px 42px;border:1px solid var(--border);border-radius:99px;outline:none;background:var(--surface2);font-size:16px;transition:.2s}#search:focus{background:var(--surface3);border-color:var(--accent);box-shadow:0 0 0 3px #8b5cf626}#search::placeholder{color:var(--muted)}#clear-search{position:absolute;right:8px;width:28px;height:28px;display:none;align-items:center;justify-content:center;border:0;border-radius:50%;background:var(--surface3);font-size:18px;color:var(--muted)}#clear-search.visible{display:flex}
/* Griglia canali */
#content{flex:1;overflow:auto;overflow-x:hidden;padding-bottom:calc(var(--nav-h) + var(--nav-inset) + 16px);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}.stats-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px var(--pad) 0}#stats-line{min-width:0;color:var(--muted);font-size:13px}#stats-line strong{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}#stats-actions,#favorites-actions{display:flex;align-items:center;justify-content:flex-end;flex-shrink:0}.favorites-tools{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:7px 10px;margin:12px var(--pad) 0;padding:11px 12px;border:1px solid var(--border);border-radius:14px;background:linear-gradient(135deg,#8b5cf610,#ec489908)}.favorites-tools.hidden{display:none}.favorites-tools label{color:var(--muted);font-size:12px;font-weight:700}.favorites-tools select{min-width:0;width:100%;padding:9px 30px 9px 11px;border:1px solid var(--border);border-radius:10px;outline:none;background:var(--surface2);color:var(--text);font-size:13px}.favorites-tools select:focus{border-color:var(--accent)}#favorites-hint{grid-column:1/-1;color:var(--muted);font-size:11px}#channel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(160px,42vw),1fr));gap:var(--gap);padding:var(--pad)}.channel-card{position:relative;overflow:hidden;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);cursor:pointer;animation:fade .3s ease;transition:transform .2s,border-color .2s,box-shadow .2s}.channel-card:active{transform:scale(.975)}.channel-card.active{border-color:var(--accent);box-shadow:0 0 0 2px #8b5cf644,0 0 22px #8b5cf622}.card-thumb{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:16/10;padding:20px;overflow:hidden;background:radial-gradient(ellipse at 50% 50%,#8b5cf61b,transparent 70%),linear-gradient(135deg,var(--surface2),var(--surface))}.card-logo{position:relative;z-index:1;max-width:82%;max-height:82%;object-fit:contain;filter:drop-shadow(0 3px 9px #0008)}.card-badge{position:absolute;top:8px;left:8px;z-index:2;padding:4px 8px;border-radius:7px;background:#0009;color:#fff;font-size:10px;font-weight:800;font-variant-numeric:tabular-nums;backdrop-filter:blur(10px)}.card-star{position:absolute;top:6px;right:6px;z-index:2;width:34px;height:34px;display:grid;place-items:center;padding:0;border:1px solid #ffffff12;border-radius:50%;background:#0009;color:#ffffffb3;font-size:18px;line-height:1;backdrop-filter:blur(10px);transition:.15s}.card-star.active{background:#fbbf2430;color:var(--star)}.card-star:active{transform:scale(.86)}.card-info{padding:7px 12px 7px}.card-name,.card-category{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.2}.card-name{margin-bottom:0;font-size:13px;font-weight:700}.card-category{color:var(--muted);font-size:11px}.card-reorder{display:none;gap:7px;margin-top:5px}.favorites-mode.custom-sort .card-reorder{display:flex}.move-fav{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--border);border-radius:9px;background:var(--surface2);color:#c9c3ff;font-size:11px;font-weight:750}.move-fav:active:not(:disabled){background:var(--surface3);transform:scale(.97)}.move-fav:disabled{opacity:.28;cursor:default}.skeleton{border-radius:var(--radius);background:linear-gradient(90deg,var(--surface),var(--surface2),var(--surface));background-size:200% 100%;animation:shimmer 1.5s infinite}.skeleton-card{aspect-ratio:16/10}.empty{grid-column:1/-1;padding:42px 24px;text-align:center;color:var(--muted)}.empty-icon{margin-bottom:14px;font-size:46px;opacity:.7}.empty h3{margin:0 0 8px;color:var(--text);font-size:16px}.empty p{margin:0;font-size:13px;line-height:1.5}
/* Diagnostica e caricamento progressivo */
.diag{margin:16px 0;padding:12px;border-radius:13px;background:var(--surface2);text-align:left;font-size:12px}.diag-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}.diag-row:last-child{border:0}.diag-dot{width:20px;height:20px;display:grid;place-items:center;flex-shrink:0;border-radius:50%;font-size:11px;font-weight:800}.diag-row.ok .diag-dot{background:#10b98125;color:var(--green)}.diag-row.fail .diag-dot{background:#ff4d5c25;color:var(--red)}.diag-host{flex:1;overflow:hidden;color:var(--text);font-family:monospace;text-overflow:ellipsis;white-space:nowrap}.diag-msg{flex-shrink:0;color:var(--muted);font-size:11px}.diag-row.fail .diag-msg{color:var(--red)}.retry-btn{margin-top:12px;padding:12px 22px;border:0;border-radius:99px;background:var(--gradient);color:#fff;font-size:14px;font-weight:700}.diag-hint{margin-top:12px;color:var(--muted);font-size:11px;line-height:1.5}#loading-more{display:flex;justify-content:center;padding:24px}#loading-more.hidden,.hidden{display:none!important}.spinner{width:32px;height:32px;border:3px solid var(--surface3);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
/* Navigazione inferiore */
#bottom-nav{position:absolute;right:0;bottom:var(--nav-inset);left:0;z-index:50;height:var(--nav-h);display:flex;align-items:center;padding:2px 0 0;border-top:1px solid var(--border);background:#0a0b13}#bottom-nav::after{content:"";position:absolute;top:100%;right:0;left:0;height:var(--nav-inset);background:#0a0b13;pointer-events:none}.nav-btn{position:relative;display:flex;flex:1;height:100%;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px;border:0;background:none;color:var(--muted);transition:color .2s}.nav-btn.active{color:var(--text)}.nav-btn svg{width:21px;height:21px;transition:transform .2s}.nav-btn.active svg{transform:scale(1.1);filter:drop-shadow(0 0 6px #8b5cf699)}.nav-btn span:not(.nav-badge){font-size:10px;font-weight:600}.nav-btn.active:after{position:absolute;bottom:6px;left:50%;width:4px;height:4px;border-radius:50%;background:var(--accent);content:"";transform:translateX(-50%)}.nav-badge{position:absolute;top:6px;right:calc(50% - 23px);min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--gradient);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 7px #8b5cf655}
/* Lettore: scena video, testata e barra comandi */
#player-modal{position:fixed;inset:0;z-index:200;width:100vw;height:var(--app-h);overflow:hidden;background:radial-gradient(ellipse at 50% 46%,#171a2a 0%,#05060a 62%);transform:translateY(105%);transition:transform .42s cubic-bezier(.32,.72,0,1);will-change:transform}#player-modal.open{transform:translateY(0)}#player-video-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}#video{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;background:#000;outline:none;transition:transform .2s;-webkit-user-select:none;user-select:none;color-scheme:dark}#video.fit-fill{object-fit:cover}#video.fit-zoom{object-fit:cover;transform:scale(1.2)}
.player-back{position:absolute;top:var(--player-header-top,calc(13px + var(--safe-t)));left:calc(13px + var(--safe-l));z-index:12;width:44px;height:44px;display:grid;place-items:center;padding:0;border:1px solid #ffffff20;border-radius:50%;background:#080a12a8;color:white;backdrop-filter:blur(18px);box-shadow:0 5px 20px #0006;transition:.15s}.player-back:active{transform:scale(.9);background:#000d}#player-top{position:absolute;top:var(--player-header-top,calc(13px + var(--safe-t)));right:0;left:0;z-index:5;display:flex;align-items:center;gap:12px;min-height:44px;padding:0 calc(17px + var(--safe-r)) 0 calc(70px + var(--safe-l));background:linear-gradient(180deg,#05060ad9,transparent);opacity:0;pointer-events:none;transition:opacity .25s}#player-modal.show-controls #player-top{opacity:1;pointer-events:auto}.player-logo{width:38px;height:38px;flex:0 0 38px;object-fit:contain;filter:drop-shadow(0 2px 6px #0008)}.player-title-info{flex:1;min-width:0;color:#fff;text-shadow:0 1px 4px #000b}.player-num{margin-bottom:2px;color:#ffffffa8;font-size:10px;font-weight:800;letter-spacing:.1em}.player-name{overflow:hidden;font-size:15px;font-weight:750;text-overflow:ellipsis;white-space:nowrap}.player-live{display:inline-flex;align-items:center;gap:6px;flex-shrink:0;padding:6px 9px;border:1px solid #ff4d5c33;border-radius:99px;background:#ff4d5c22;color:#ff6875;font-size:9px;font-weight:900;letter-spacing:.08em}.player-live i{width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);animation:pulse 1.4s infinite}.player-action{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;padding:0;border:1px solid #ffffff20;border-radius:50%;background:#ffffff18;color:#fff;font-size:19px;backdrop-filter:blur(16px);transition:.15s}.player-action svg{width:18px;height:18px;display:block}.player-action.active{border-color:#fbbf2455;background:#fbbf2433;color:var(--star)}.player-action:active{transform:scale(.9)}.player-action:disabled{opacity:.45;cursor:not-allowed}#player-status{position:absolute;top:50%;left:50%;z-index:8;display:none;width:max-content;max-width:85%;padding:22px;border:1px solid #ffffff20;border-radius:18px;background:#10131de8;color:#fff;text-align:center;font-size:14px;line-height:1.5;backdrop-filter:blur(18px);transform:translate(-50%,-50%)}#player-status.visible{display:block}#player-status button{margin-top:13px;padding:10px 18px;border:0;border-radius:99px;background:var(--gradient);color:#fff;font-size:13px;font-weight:800}#player-loading{position:absolute;top:50%;left:50%;z-index:7;display:none;transform:translate(-50%,-50%)}#player-loading.visible{display:block}#player-loading .spinner{width:48px;height:48px;border-width:4px}#unmute-overlay{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#05060a80;backdrop-filter:blur(5px);cursor:pointer}#unmute-overlay.visible{display:flex}.unmute-icon{width:76px;height:76px;display:grid;place-items:center;border:1px solid #ffffff50;border-radius:50%;background:var(--gradient);color:white;font-size:30px;box-shadow:0 8px 35px #8b5cf677;animation:pulse 2s infinite}.unmute-label{color:white;font-size:13px;font-weight:700;text-shadow:0 2px 6px #000}
/* Backup preferiti */
#backup-modal{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;padding:24px;background:#000b;backdrop-filter:blur(9px)}#backup-modal.visible{display:flex}.modal-card{width:100%;max-width:350px;padding:24px;border:1px solid var(--border);border-radius:21px;background:var(--surface);text-align:center;box-shadow:0 20px 60px #0008}.modal-card h3{margin:0 0 7px;font-size:17px}.modal-sub{margin:0 0 18px;color:var(--muted);font-size:12px;line-height:1.45}.modal-btn{display:block;width:100%;margin-bottom:8px;padding:14px 16px;border:1px solid var(--border);border-radius:13px;background:var(--surface2);font-size:14px;font-weight:650;transition:.15s}.modal-btn:active{transform:scale(.97);background:var(--surface3)}.modal-btn.cancel{margin:0;border-color:transparent;background:transparent;color:var(--muted)}.modal-status{min-height:15px;margin-top:12px;color:var(--green);font-size:11px}
#toast{position:fixed;bottom:calc(var(--nav-h) + var(--nav-inset) + 20px);left:50%;z-index:500;display:flex;max-width:calc(100vw - 32px);align-items:center;gap:8px;padding:12px 20px;border:1px solid #ffffff1a;border-radius:99px;background:#1e2030f5;color:var(--text);font-size:13px;font-weight:600;white-space:nowrap;opacity:0;pointer-events:none;box-shadow:0 5px 22px #0008;backdrop-filter:blur(18px);transform:translate(-50%,20px);transition:opacity .25s,transform .25s}#toast.show{opacity:1;transform:translate(-50%,0)}#toast.star-toast{color:var(--star)}#content::-webkit-scrollbar{width:4px}#content::-webkit-scrollbar-thumb{border-radius:3px;background:var(--surface3)}
@keyframes pulse{50%{opacity:.65;transform:scale(.88)}}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes shimmer{to{background-position:-200% 0}}@keyframes spin{to{transform:rotate(360deg)}}
@media(min-width:900px){#app-header{padding:calc(16px + var(--safe-t)) 24px 16px}#stats-line{padding:13px 24px 0}#channel-grid{grid-template-columns:repeat(4,1fr);padding:14px 24px}}@media(min-width:1200px){#channel-grid{grid-template-columns:repeat(5,1fr)}}@media(max-width:390px){#player-top{gap:6px;padding-right:calc(9px + var(--safe-r));padding-left:calc(62px + var(--safe-l))}.player-logo{width:32px;height:32px;flex-basis:32px}.player-name{font-size:13px}.player-live{padding:5px 7px;font-size:8px}.player-action{width:34px;height:34px;flex-basis:34px}}@media(max-width:360px){:root{--nav-h:58px}#app-header{padding:calc(8px + max(var(--safe-t),var(--tg-safe-t)) + var(--tg-content-t)) var(--pad) 8px}.brand-row{justify-content:center;margin-bottom:8px}.brand h1{font-size:15px}.live-indicator{padding:4px 7px;font-size:9px}.header-icon-btn{width:31px;height:31px}#search{padding:10px 40px 10px 38px;font-size:15px}.card-info{padding:6px 10px 6px}.card-name{font-size:12px}.card-category{font-size:10px}.card-star{width:30px;height:30px}.player-back{width:40px;height:40px}#player-top{padding-left:calc(58px + var(--safe-l))}.player-live{display:none}.player-action{width:32px;height:32px;flex-basis:32px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<body>
<div id="app">
  <header id="app-header">
    <div class="brand-row">
      <div class="brand"><span class="brand-dot"></span><h1>TV LIVE</h1></div>
      <div class="header-actions"><div class="live-indicator"><span class="live-dot"></span>IN DIRETTA</div></div>
    </div>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"/></svg>
      <input id="search" type="search" placeholder="Cerca canale…" autocomplete="off" inputmode="search" enterkeyhint="search">
      <button id="clear-search" aria-label="Cancella">×</button>
    </div>
  </header>
  <main id="content"><div id="stats-row" class="stats-row"><div id="stats-line">Caricamento…</div><div id="stats-actions"><button class="header-icon-btn" id="backup-btn" aria-label="Backup preferiti" title="Backup preferiti">💾</button></div></div><div id="favorites-tools" class="favorites-tools hidden"><label for="favorites-sort">Ordina per</label><select id="favorites-sort"><option value="custom">Ordine personalizzato</option><option value="name">Nome A–Z</option><option value="name-desc">Nome Z–A</option><option value="group">Categoria</option><option value="channel">Numero canale</option></select><div id="favorites-actions"></div><span id="favorites-hint">Usa i pulsanti ↑ e ↓ per spostare i canali.</span></div><div id="channel-grid"></div><div id="loading-more"><div class="spinner"></div></div></main>
  <nav id="bottom-nav" role="tablist">
    <button class="nav-btn active" data-mode="all" role="tab" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg><span>Canali</span></button>
    <button class="nav-btn" data-mode="favorites" role="tab" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3.1 6.26 6.9 1-5 4.87 1.18 6.87L12 17.77l-6.18 3.25L7 14.13 2 9.27l6.9-1L12 2Z"/></svg><span>Preferiti</span><span class="nav-badge hidden" id="fav-badge">0</span></button>
  </nav>
  <section id="player-modal" role="dialog" aria-modal="true" aria-label="Lettore TV">
    <button class="player-back" id="player-back" aria-label="Indietro"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <div id="player-video-wrap">
      <video id="video" controls playsinline webkit-playsinline x5-playsinline preload="metadata"></video>
      <div id="player-loading"><div class="spinner"></div></div><div id="player-status"></div>
      <div id="unmute-overlay"><div class="unmute-icon">🔊</div><div class="unmute-label">Tocca per attivare l'audio</div></div>
    </div>
    <div id="player-top">
      <img id="player-logo" class="player-logo" alt="" hidden>
      <div class="player-title-info"><div class="player-num" id="player-num">CANALE #0</div><div class="player-name" id="player-name">Canale</div></div>
      <div class="player-live"><i></i> LIVE</div>
      <button class="player-action" id="player-pip" type="button" aria-label="Attiva Picture-in-Picture" title="Mini schermo" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M13 12h6v5h-6z"/></svg></button>
      <button class="player-action" id="player-fs" type="button" aria-label="Schermo intero" title="Schermo intero" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/></svg></button>
      <button class="player-action" id="player-star" aria-label="Aggiungi ai preferiti">☆</button>
    </div>

  </section>
  <section id="backup-modal" role="dialog" aria-modal="true" aria-label="Backup preferiti">

<script>
(() => {

  const PLACEHOLDER_LOGO = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60"><rect width="60" height="60" fill="#2a2a3d"/><text x="30" y="36" text-anchor="middle" fill="#8b8b9e" font-size="14" font-family="sans-serif" font-weight="bold">TV</text></svg>');

  let channels = [], filtered = [], favorites = new Set(), favoriteOrder = [], favoriteSort = 'custom', mode = 'all', query = '', shown = 0, hls = null, activeChannel = null, activeUrl = null, observer = null, toastTimer, controlsTimer, searchTimer, lastLoadLog = [], initialTgFullscreen = false, playerChangedTgFullscreen = false, tgFullscreenUnsupported = false;

  // Gestisce viewport e aree sicure: evita che la testata finisca sotto i controlli Telegram.
  function updateTelegramInsets(){
    const px=value=>Math.max(0,Number(value)||0)+'px';

    // includere aree di interfaccia non pertinenti e creare spazio vuoto.

  }
  function updateHeight(){ const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight || (IS_TG && (tg.viewportHeight || tg.viewportStableHeight)); if(h > 0) document.documentElement.style.setProperty('--app-h', Math.round(h)+'px'); updateTelegramInsets(); }
  updateHeight();
  window.addEventListener('resize', updateHeight);
  window.addEventListener('orientationchange', () => setTimeout(updateHeight,150));
  window.visualViewport?.addEventListener('resize', updateHeight);
  if(IS_TG){ try{tg.ready();tg.expand();tg.setHeaderColor?.('#090a12');tg.setBackgroundColor?.('#090a12');tg.disableVerticalSwipes?.();tg.onEvent?.('viewportChanged',updateHeight);tg.onEvent?.('safeAreaChanged',updateTelegramInsets);tg.onEvent?.('contentSafeAreaChanged',updateTelegramInsets);tg.onEvent?.('fullscreenChanged',()=>{playerChangedTgFullscreen=!!(el.modal.classList.contains('open')&&!!tg.isFullscreen!==initialTgFullscreen);updateHeight();requestAnimationFrame(()=>{if(el.modal.classList.contains('open'))updatePlayerFrame();});updateFullscreenButton();});tg.onEvent?.('fullscreenFailed',event=>{tgFullscreenUnsupported=true;updateFullscreenButton();toast(event?.error==='UNSUPPORTED'?'Schermo intero Telegram non supportato su questo dispositivo.':'Telegram non ha potuto attivare lo schermo intero.');});}catch(e){} }

  const normalize = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  function haptic(style='light'){ try{ if(IS_TG && tg.HapticFeedback){tg.HapticFeedback.impactOccurred(style);return;} }catch(e){} if(navigator.vibrate) navigator.vibrate(8); }
  function toast(message, star=false){ el.toast.textContent=message;el.toast.className='show'+(star?' star-toast':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.toast.classList.remove('show'),2500); }

  // Preferiti: salvataggio locale/cloud, ordine personalizzato e backup compatibile.
  function saveFavorites(){const data=JSON.stringify([...favorites]);try{localStorage.setItem(FAVORITES_KEY,data);}catch(e){console.warn('Favorites save:',e);}if(HAS_CLOUD){try{tg.CloudStorage.setItem(CLOUD_KEY,data,err=>{if(err)console.warn('CloudStorage save:',err);});}catch(e){}}}
  function saveFavoriteOrder(){const data=JSON.stringify(favoriteOrder);try{localStorage.setItem(ORDER_KEY,data);localStorage.setItem(SORT_KEY,favoriteSort);}catch(e){console.warn('Favorite order save:',e);}if(HAS_CLOUD){try{tg.CloudStorage.setItem(CLOUD_ORDER_KEY,data,err=>{if(err)console.warn('Cloud order save:',err);});}catch(e){}}}
  function ensureFavoriteOrder(save=true){const next=favoriteOrder.filter((url,i,array)=>favorites.has(url)&&array.indexOf(url)===i);favorites.forEach(url=>{if(!next.includes(url))next.push(url);});favoriteOrder=next;if(save)saveFavoriteOrder();}
  function loadLocalFavorites(){try{const data=JSON.parse(localStorage.getItem(FAVORITES_KEY)||'[]');if(Array.isArray(data))favorites=new Set(data.filter(x=>typeof x==='string'));const order=JSON.parse(localStorage.getItem(ORDER_KEY)||'null');if(Array.isArray(order))favoriteOrder=order.filter(x=>typeof x==='string');const sort=localStorage.getItem(SORT_KEY);if(['custom','name','name-desc','group','channel'].includes(sort))favoriteSort=sort;}catch(e){console.warn('Favorites load:',e);}ensureFavoriteOrder(false);}
  function mergeCloudFavorites(){if(!HAS_CLOUD)return;try{tg.CloudStorage.getItem(CLOUD_KEY,(err,value)=>{if(err){console.warn('Cloud favorites load:',err);return;}if(value){try{const data=JSON.parse(value);if(Array.isArray(data))data.forEach(x=>{if(typeof x==='string')favorites.add(x);});}catch(e){}}else if(favorites.size)saveFavorites();tg.CloudStorage.getItem(CLOUD_ORDER_KEY,(orderErr,cloudValue)=>{if(!orderErr&&cloudValue){try{const cloudOrder=JSON.parse(cloudValue);if(Array.isArray(cloudOrder)){const merged=cloudOrder.filter(x=>typeof x==='string'&&favorites.has(x));favoriteOrder.forEach(x=>{if(favorites.has(x)&&!merged.includes(x))merged.push(x);});favoriteOrder=merged;}}catch(e){}}ensureFavoriteOrder(false);saveFavorites();saveFavoriteOrder();updateFavBadge();if(channels.length)applyFilters();});});}catch(e){console.warn('Cloud sync:',e);}}
  const isFav=url=>favorites.has(url);
  function toggleFav(url){const active=!favorites.has(url);if(active){favorites.add(url);if(!favoriteOrder.includes(url))favoriteOrder.push(url);}else{favorites.delete(url);favoriteOrder=favoriteOrder.filter(item=>item!==url);}saveFavorites();saveFavoriteOrder();return active;}
  function openBackup(){el.backupStatus.textContent='';el.backupStatus.style.color='var(--green)';el.backup.classList.add('visible');haptic();}
  function closeBackup(){el.backup.classList.remove('visible');}
  function exportFavorites(){const keys=[...favorites];if(!keys.length){el.backupStatus.textContent='⚠️ Nessun preferito da esportare';el.backupStatus.style.color='var(--red)';return;}try{const data={app:'TV LIVE',version:1,exportedAt:new Date().toISOString(),count:keys.length,favorites:keys,favoriteOrder:[...favoriteOrder],favoriteSort};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tv-live-preferiti-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);el.backupStatus.style.color='var(--green)';el.backupStatus.textContent='✅ File esportato ('+keys.length+' preferiti)';haptic();}catch(e){el.backupStatus.style.color='var(--red)';el.backupStatus.textContent='❌ Esportazione non riuscita';}}
  function importFavorites(file){const reader=new FileReader();reader.onload=event=>{try{const data=JSON.parse(event.target.result),items=Array.isArray(data)?data:data?.favorites;if(!Array.isArray(items))throw Error('Formato non valido');let added=0;items.forEach(x=>{if(typeof x==='string'&&!favorites.has(x)){favorites.add(x);added++;}});if(Array.isArray(data?.favoriteOrder))favoriteOrder=data.favoriteOrder.filter(x=>typeof x==='string'&&favorites.has(x));ensureFavoriteOrder(false);if(['custom','name','name-desc','group','channel'].includes(data?.favoriteSort))favoriteSort=data.favoriteSort;saveFavorites();saveFavoriteOrder();updateFavBadge();if(channels.length)applyFilters();el.backupStatus.style.color='var(--green)';el.backupStatus.textContent='✅ Importati '+added+' nuovi preferiti (totale '+favorites.size+')';haptic();}catch(e){el.backupStatus.style.color='var(--red)';el.backupStatus.textContent='❌ File non valido';}};reader.readAsText(file);}
  $('backup-btn').addEventListener('click',openBackup);$('cancel-backup').addEventListener('click',closeBackup);$('export-btn').addEventListener('click',exportFavorites);$('import-btn').addEventListener('click',()=>{el.file.value='';el.file.click();});el.file.addEventListener('change',e=>{if(e.target.files?.[0])importFavorites(e.target.files[0]);});el.backup.addEventListener('click',e=>{if(e.target===el.backup)closeBackup();});

  // Lettura e parsing delle playlist M3U.
  function parseM3U(text){const result=[];let current=null;for(const raw of (text||'').split(/\r?\n/)){const line=raw.trim();if(!line)continue;if(line.startsWith('#EXTINF:')){const info=line.slice(8),comma=info.indexOf(','),attrs=comma<0?info:info.slice(0,comma);current={name:comma<0?'Sconosciuto':info.slice(comma+1).trim(),url:'',logo:attrs.match(/tvg-logo="([^"]*)"/)?.[1]||'',group:(attrs.match(/(?:group-title|tvg-group)="([^"]*)"/i)?.[1]||'Generale').trim()||'Generale'};}else if(line[0]!=='#'&&current){current.url=line;if(current.name)result.push(current);current=null;}}return result;}
  function loadText(url){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('GET',url,true);xhr.timeout=FETCH_TIMEOUT;xhr.onload=()=>xhr.status>=200&&xhr.status<300?resolve(xhr.responseText||''):reject(Error('HTTP '+xhr.status));xhr.onerror=()=>reject(Error('CORS/rete'));xhr.ontimeout=()=>reject(Error('Timeout'));xhr.onabort=()=>reject(Error('Annullato'));xhr.send();});}
  function skeletons(){el.grid.replaceChildren();for(let i=0;i<8;i++){const item=document.createElement('div');item.className='skeleton skeleton-card';el.grid.appendChild(item);}}
  async function loadPlaylists(){skeletons();el.stats.textContent='Caricamento playlist…';el.loader.classList.remove('hidden');lastLoadLog=[];const lists=await Promise.all(PLAYLISTS.map(async url=>{try{const text=await loadText(url),items=parseM3U(text);lastLoadLog.push({url,ok:true,count:items.length});return items;}catch(error){lastLoadLog.push({url,ok:false,error:error.message||String(error)});return [];}}));const seen=new Set(),merged=[];lists.flat().forEach(ch=>{const key=ch.url.toLowerCase().split('?')[0].replace(/\/+$/,'');if(!seen.has(key)){seen.add(key);merged.push(ch);}});channels=merged.map((ch,i)=>({...ch,num:i+1}));if(!channels.length){showLoadError();return;}ensureFavoriteOrder();const failed=lastLoadLog.filter(x=>!x.ok);if(failed.length){const names=failed.map(x=>{try{return new URL(x.url).host;}catch(e){return 'fonte';}});toast('⚠️ '+failed.length+' playlist non caricate: '+names.join(', '));}applyFilters();}
  function showLoadError(){el.grid.replaceChildren();const box=document.createElement('div');box.className='empty';box.innerHTML='<div class="empty-icon">⚠️</div><h3>Impossibile caricare i canali</h3><p>Nessuna playlist ha risposto. Diagnostica:</p>';const diag=document.createElement('div');diag.className='diag';lastLoadLog.forEach(log=>{const row=document.createElement('div');row.className='diag-row '+(log.ok?'ok':'fail');const host=document.createElement('span');host.className='diag-host';host.textContent=new URL(log.url).host;const dot=document.createElement('span');dot.className='diag-dot';dot.textContent=log.ok?'✓':'✕';const msg=document.createElement('span');msg.className='diag-msg';msg.textContent=log.ok?log.count+' canali':log.error;row.append(dot,host,msg);diag.appendChild(row);});const retry=document.createElement('button');retry.className='retry-btn';retry.textContent='🔄 Riprova';retry.addEventListener('click',loadPlaylists);const hint=document.createElement('p');hint.className='diag-hint';hint.textContent='Se il problema persiste, apri il link direttamente in Safari/Chrome: alcuni WebView di Telegram bloccano richieste cross-origin.';box.append(diag,retry,hint);el.grid.appendChild(box);el.loader.classList.add('hidden');}

  // Ricerca, ordinamento dei preferiti e caricamento progressivo a gruppi.
  function getFavoriteChannels(){const list=channels.filter(ch=>isFav(ch.url));if(favoriteSort==='name')return list.sort((a,b)=>normalize(a.name).localeCompare(normalize(b.name),'it'));if(favoriteSort==='name-desc')return list.sort((a,b)=>normalize(b.name).localeCompare(normalize(a.name),'it'));if(favoriteSort==='group')return list.sort((a,b)=>normalize(a.group).localeCompare(normalize(b.group),'it')||normalize(a.name).localeCompare(normalize(b.name),'it'));if(favoriteSort==='channel')return list.sort((a,b)=>a.num-b.num);const order=new Map(favoriteOrder.map((url,index)=>[url,index]));return list.sort((a,b)=>(order.get(a.url)??Number.MAX_SAFE_INTEGER)-(order.get(b.url)??Number.MAX_SAFE_INTEGER)||a.num-b.num);}
  function updateFavoriteTools(){const visible=mode==='favorites';el.favTools.classList.toggle('hidden',!visible);el.favSort.value=favoriteSort;el.favHint.textContent=favoriteSort==='custom'?'Usa i pulsanti ↑ e ↓ per spostare i canali.':'Ordine automatico: i pulsanti di spostamento sono disattivati.';(visible?el.favActions:el.statsActions).appendChild(el.backupButton);el.grid.classList.toggle('favorites-mode',visible);el.grid.classList.toggle('custom-sort',favoriteSort==='custom');}
  function moveFavorite(url,direction){if(favoriteSort!=='custom')return;const ordered=query?filtered:getFavoriteChannels(),index=ordered.findIndex(ch=>ch.url===url),target=ordered[index+direction];if(index<0||!target)return;const from=favoriteOrder.indexOf(url),to=favoriteOrder.indexOf(target.url);if(from<0||to<0)return;[favoriteOrder[from],favoriteOrder[to]]=[favoriteOrder[to],favoriteOrder[from]];saveFavoriteOrder();applyFilters();haptic();toast('Ordine preferiti aggiornato');}
  function applyFilters(){const source=mode==='favorites'?getFavoriteChannels():channels;const q=normalize(query);filtered=source.filter(ch=>!q||normalize(ch.name).includes(q)||normalize(ch.group).includes(q));shown=0;el.grid.replaceChildren();updateFavoriteTools();updateStats();updateFavBadge();if(!filtered.length){renderEmpty();el.loader.classList.add('hidden');return;}el.loader.classList.remove('hidden');renderNextBatch();}
  function updateStats(){const total=channels.length,filtering=!!query||mode==='favorites';el.stats.innerHTML=filtering?'<strong>'+filtered.length.toLocaleString('it-IT')+'</strong> risultati'+(mode==='favorites'?' nei preferiti':' su '+total.toLocaleString('it-IT')):'<strong>'+total.toLocaleString('it-IT')+'</strong> canali disponibili';}
  function updateFavBadge(){const count=channels.reduce((n,ch)=>n+(isFav(ch.url)?1:0),0);el.badge.textContent=count>999?'999+':count;el.badge.classList.toggle('hidden',!count);}
  function renderEmpty(){const fav=mode==='favorites',hasQuery=!!query;const icon=fav?(hasQuery?'🔍':'⭐'):'📺',title=fav?(hasQuery?'Nessun preferito trovato':'Nessun preferito'):'Nessun canale trovato',sub=fav?(hasQuery?'Modifica la ricerca.':'Tocca la stella ★ su un canale per aggiungerlo qui.'):'Prova a modificare la ricerca.';el.grid.innerHTML='<div class="empty"><div class="empty-icon">'+icon+'</div><h3>'+title+'</h3><p>'+sub+'</p></div>';}
  function renderNextBatch(){const end=Math.min(shown+BATCH_SIZE,filtered.length),fragment=document.createDocumentFragment();for(;shown<end;shown++)fragment.appendChild(createCard(filtered[shown]));el.grid.appendChild(fragment);el.loader.classList.toggle('hidden',shown>=filtered.length);}
  function createCard(ch){const card=document.createElement('article');card.className='channel-card'+(ch.url===activeUrl?' active':'');card._channel=ch;card.innerHTML='<div class="card-thumb"><img class="card-logo" loading="lazy" decoding="async" alt=""><span class="card-badge"></span><button class="card-star" type="button" aria-label="Aggiungi ai preferiti"></button></div><div class="card-info"><div class="card-name"></div><div class="card-category"></div><div class="card-reorder"><button class="move-fav" type="button" data-direction="-1" aria-label="Sposta in alto" title="Sposta in alto">↑ Su</button><button class="move-fav" type="button" data-direction="1" aria-label="Sposta in basso" title="Sposta in basso">↓ Giù</button></div></div>';const logo=card.querySelector('.card-logo');logo.src=ch.logo||PLACEHOLDER_LOGO;logo.onerror=()=>{logo.onerror=null;logo.src=PLACEHOLDER_LOGO;};card.querySelector('.card-badge').textContent='#'+ch.num;card.querySelector('.card-name').textContent=ch.name;card.querySelector('.card-category').textContent=ch.group;const star=card.querySelector('.card-star'),fav=isFav(ch.url);star.classList.toggle('active',fav);star.textContent=fav?'★':'☆';star.setAttribute('aria-pressed',String(fav));if(mode==='favorites'&&favoriteSort==='custom'){const ordered=filtered,position=ordered.findIndex(item=>item.url===ch.url),buttons=card.querySelectorAll('.move-fav');buttons[0].disabled=position<=0;buttons[1].disabled=position<0||position>=ordered.length-1;}return card;}
  el.favSort.addEventListener('change',event=>{favoriteSort=event.target.value;try{localStorage.setItem(SORT_KEY,favoriteSort);}catch(e){}applyFilters();});
  el.grid.addEventListener('click',event=>{const card=event.target.closest('.channel-card');if(!card)return;const ch=card._channel,move=event.target.closest('.move-fav');if(move){event.stopPropagation();moveFavorite(ch.url,Number(move.dataset.direction));return;}if(event.target.closest('.card-star')){const active=toggleFav(ch.url),star=card.querySelector('.card-star');star.classList.toggle('active',active);star.textContent=active?'★':'☆';star.setAttribute('aria-pressed',String(active));haptic();toast(active?'★ Aggiunto ai preferiti':'Rimosso dai preferiti',active);updateFavBadge();if(mode==='favorites'&&!active)applyFilters();else updateStats();return;}openPlayer(ch,card);});
  function setupInfiniteScroll(){if(observer)observer.disconnect();if('IntersectionObserver'in window){observer=new IntersectionObserver(entries=>{if(entries[0].isIntersecting&&shown<filtered.length)renderNextBatch();},{root:el.content,rootMargin:'400px'});observer.observe(el.loader);}else el.content.addEventListener('scroll',()=>{if(el.content.scrollTop+el.content.clientHeight>=el.content.scrollHeight-500&&shown<filtered.length)renderNextBatch();},{passive:true});}

  // Lettore HLS con fallback nativo per Safari/iOS.
  function destroyStream(){if(hls){try{hls.destroy();}catch(e){}hls=null;}try{el.video.pause();el.video.removeAttribute('src');el.video.load();}catch(e){}resetPlayerFrame();}
  function playerError(message,url){el.status.innerHTML='';const text=document.createElement('div');text.textContent=message;const button=document.createElement('button');button.id='open-ext';button.type='button';button.textContent='Apri nel browser';button.addEventListener('click',()=>{if(IS_TG&&tg.openLink){try{tg.openLink(url);return;}catch(e){}}try{window.open(url,'_blank','noopener');}catch(e){}});el.status.append(text,button);el.status.classList.add('visible');}
  function autoplay(){el.video.muted=false;el.video.volume=1;const attempt=el.video.play();if(attempt?.catch)attempt.catch(()=>{el.video.muted=true;const mutedPlay=el.video.play();mutedPlay?.catch(()=>playerError('Tocca per avviare la riproduzione.',activeUrl));el.unmute.classList.add('visible');});}
  function startStream(url){destroyStream();el.video.disablePictureInPicture=false;el.spinner.classList.add('visible');el.status.classList.remove('visible');el.unmute.classList.remove('visible');try{el.video.muted=false;el.video.volume=1;}catch(e){}
    if(window.Hls?.isSupported()){
      try{const instance=new Hls({enableWorker:true,lowLatencyMode:true,maxBufferLength:30});hls=instance;instance.loadSource(url);instance.attachMedia(el.video);instance.on(Hls.Events.MANIFEST_PARSED,()=>{if(hls!==instance)return;el.spinner.classList.remove('visible');autoplay();});instance.on(Hls.Events.ERROR,(event,data)=>{if(hls!==instance||!data.fatal)return;if(data.type===Hls.ErrorTypes.NETWORK_ERROR){playerError('Errore di rete. Riprovo…',url);setTimeout(()=>{if(hls===instance)instance.startLoad();},1500);}else if(data.type===Hls.ErrorTypes.MEDIA_ERROR){playerError('Errore media. Riprovo…',url);setTimeout(()=>{if(hls===instance)instance.recoverMediaError();},1500);}else{el.spinner.classList.remove('visible');playerError('Canale non disponibile.',url);instance.destroy();hls=null;}});}
      catch(error){console.warn('Hls init:',error);el.spinner.classList.remove('visible');playerError('Errore riproduttore.',url);}
    }else if(el.video.canPlayType('application/vnd.apple.mpegurl')){el.video.addEventListener('loadeddata',()=>{el.spinner.classList.remove('visible');autoplay();},{once:true});el.video.addEventListener('error',()=>{el.spinner.classList.remove('visible');playerError('Canale non disponibile.',url);},{once:true});el.video.src=url;}
    else{el.spinner.classList.remove('visible');playerError('HLS non supportato.',url);}
  }
  function updatePlayerStar(){if(!activeChannel)return;const fav=isFav(activeChannel.url);el.star.classList.toggle('active',fav);el.star.textContent=fav?'★':'☆';el.star.setAttribute('aria-label',fav?'Rimuovi dai preferiti':'Aggiungi ai preferiti');}
  function isFullscreen(){return !!(IS_TG&&tg?.isFullscreen)||document.fullscreenElement===el.video||document.fullscreenElement===el.modal||document.webkitFullscreenElement===el.video||document.webkitFullscreenElement===el.modal||!!el.video.webkitDisplayingFullscreen;}
  function updateFullscreenButton(){const active=isFullscreen();el.fullscreen?.classList.toggle('active',active);el.fullscreen?.setAttribute('aria-pressed',String(active));el.fullscreen?.setAttribute('aria-label',active?'Esci dallo schermo intero':'Schermo intero');el.fullscreen?.setAttribute('title',active?'Esci dallo schermo intero':'Schermo intero');}
  function isPiP(){return document.pictureInPictureElement===el.video||el.video.webkitPresentationMode==='picture-in-picture';}
  function updatePiPButton(){const active=isPiP();el.pip?.classList.toggle('active',active);el.pip?.setAttribute('aria-pressed',String(active));el.pip?.setAttribute('aria-label',active?'Esci dal mini schermo':'Attiva Picture-in-Picture');el.pip?.setAttribute('title',active?'Esci dal mini schermo':'Mini schermo');}
  async function toggleFullscreen(){
    // In Telegram va usata prima l'API ufficiale della Mini App: espande
    // l'intero player oltre le barre superiore e inferiore di Telegram.
    if(IS_TG&&!tgFullscreenUnsupported&&typeof tg?.requestFullscreen==='function'&&typeof tg?.exitFullscreen==='function'){
      try{if(tg.isFullscreen)tg.exitFullscreen();else tg.requestFullscreen();return;}
      catch(error){console.warn('Telegram fullscreen:',error);tgFullscreenUnsupported=true;}
    }
    try{
      if(document.fullscreenElement===el.video||document.fullscreenElement===el.modal||document.webkitFullscreenElement){
        if(document.exitFullscreen)await document.exitFullscreen();
        else if(el.video.webkitExitFullscreen)el.video.webkitExitFullscreen();
      }else if(el.video.webkitDisplayingFullscreen&&el.video.webkitExitFullscreen){el.video.webkitExitFullscreen();}
      else if(el.video.requestFullscreen){try{await el.video.requestFullscreen({navigationUI:'hide'});}catch(firstError){await el.video.requestFullscreen();}}
      else if(el.video.webkitEnterFullscreen){el.video.webkitEnterFullscreen();}
      else if(el.modal.requestFullscreen){try{await el.modal.requestFullscreen({navigationUI:'hide'});}catch(firstError){await el.modal.requestFullscreen();}}
      else{toast('Schermo intero non supportato da questo browser.');}
    }catch(error){console.warn('Fullscreen:',error);toast('Schermo intero non disponibile in questo ambiente.');}
    updateFullscreenButton();
  }
  async function togglePiP(){
    try{
      if(document.pictureInPictureElement===el.video){await document.exitPictureInPicture();}
      else if(document.pictureInPictureEnabled&&el.video.requestPictureInPicture){await el.video.requestPictureInPicture();}
      else if(el.video.webkitSupportsPresentationMode?.('picture-in-picture')){el.video.webkitSetPresentationMode('picture-in-picture');}
      else{toast('Mini schermo non supportato da questo browser o da Telegram.');return;}
    }catch(error){console.warn('Picture-in-Picture:',error);toast('Mini schermo non disponibile. Prova ad aprire TV LIVE nel browser esterno.');}
    updatePiPButton();
  }
  // Ridimensiona l'elemento video sul fotogramma reale: i controlli nativi
  // restano così vicini all'immagine invece che al bordo dello schermo.
  function updatePlayerFrame(){
    const video=el.video,wrap=video.parentElement,w=video.videoWidth,h=video.videoHeight;
    if(!w||!h||!wrap)return;
    const area=wrap.getBoundingClientRect();
    if(!area.width||!area.height)return;
    const scale=Math.min(area.width/w,area.height/h);
    video.style.width=Math.round(w*scale)+'px';
    video.style.height=Math.round(h*scale)+'px';
    requestAnimationFrame(()=>{
      if(!el.modal.classList.contains('open'))return;
      const frame=video.getBoundingClientRect();
      const root=getComputedStyle(document.documentElement);
      const safe=Math.max(parseFloat(root.getPropertyValue('--safe-t'))||0,parseFloat(root.getPropertyValue('--tg-safe-t'))||0);
      const topFloor=Math.max(safe+8,IS_TG?96:safe+8);
      const top=Math.max(topFloor,frame.top-58);
      document.documentElement.style.setProperty('--player-header-top',Math.round(top)+'px');
    });
  }
  function resetPlayerFrame(){el.video.style.width='100%';el.video.style.height='100%';document.documentElement.style.removeProperty('--player-header-top');}
  el.video.addEventListener('loadedmetadata',updatePlayerFrame);
  el.video.addEventListener('playing',updatePlayerFrame);
  window.addEventListener('resize',()=>{if(el.modal.classList.contains('open'))updatePlayerFrame();});
  window.visualViewport?.addEventListener('resize',()=>{if(el.modal.classList.contains('open'))updatePlayerFrame();});
  function showPlayerControls(){el.modal.classList.add('show-controls');clearTimeout(controlsTimer);controlsTimer=setTimeout(()=>{if(!el.video.paused)el.modal.classList.remove('show-controls');},3500);}
  function openPlayer(ch,card){haptic();initialTgFullscreen=!!(IS_TG&&tg?.isFullscreen);playerChangedTgFullscreen=false;activeChannel=ch;activeUrl=ch.url;el.number.textContent='CANALE #'+ch.num;el.name.textContent=ch.name;el.logo.hidden=!ch.logo;if(ch.logo){el.logo.src=ch.logo;el.logo.onerror=()=>{el.logo.hidden=true;};}updatePlayerStar();document.querySelectorAll('.channel-card.active').forEach(item=>item.classList.remove('active'));card?.classList.add('active');el.modal.classList.add('open');document.body.style.overflow='hidden';updateFullscreenButton();updatePiPButton();try{tg?.BackButton?.show();}catch(e){}try{history.pushState({modal:'player'},'');}catch(e){}startStream(ch.url);showPlayerControls();}
  function closePlayer(fromHistory=false){el.modal.classList.remove('open','show-controls');document.body.style.overflow='';try{if(document.pictureInPictureElement===el.video)document.exitPictureInPicture().catch(()=>{});else if(el.video.webkitPresentationMode==='picture-in-picture')el.video.webkitSetPresentationMode('inline');}catch(e){}destroyStream();activeChannel=null;activeUrl=null;el.unmute.classList.remove('visible');try{tg?.BackButton?.hide();}catch(e){}try{if(IS_TG&&playerChangedTgFullscreen&&typeof tg?.exitFullscreen==='function'&&typeof tg?.requestFullscreen==='function'){if(initialTgFullscreen&&!tg.isFullscreen)tg.requestFullscreen();else if(!initialTgFullscreen&&tg.isFullscreen)tg.exitFullscreen();}if(document.fullscreenElement||document.webkitFullscreenElement){if(document.exitFullscreen)document.exitFullscreen().catch(()=>{});else if(el.video.webkitExitFullscreen)el.video.webkitExitFullscreen();}else if(el.video.webkitDisplayingFullscreen&&el.video.webkitExitFullscreen)el.video.webkitExitFullscreen();}catch(e){}updateFullscreenButton();updatePiPButton();if(!fromHistory&&history.state?.modal==='player'){try{history.back();}catch(e){}}}
  el.back.addEventListener('click',()=>closePlayer());
  el.fullscreen.addEventListener('click',event=>{event.stopPropagation();toggleFullscreen();});
  el.pip.addEventListener('click',event=>{event.stopPropagation();togglePiP();});
  document.addEventListener('fullscreenchange',updateFullscreenButton);
  document.addEventListener('webkitfullscreenchange',updateFullscreenButton);
  el.video.addEventListener('webkitbeginfullscreen',updateFullscreenButton);
  el.video.addEventListener('webkitendfullscreen',updateFullscreenButton);
  el.video.addEventListener('enterpictureinpicture',updatePiPButton);
  el.video.addEventListener('leavepictureinpicture',updatePiPButton);
  el.video.addEventListener('webkitpresentationmodechanged',updatePiPButton);
  el.star.addEventListener('click',()=>{if(!activeChannel)return;const active=toggleFav(activeChannel.url);updatePlayerStar();haptic();toast(active?'★ Aggiunto ai preferiti':'Rimosso dai preferiti',active);updateFavBadge();if(mode==='favorites')applyFilters();});
  el.unmute.addEventListener('click',()=>{el.video.muted=false;if(el.video.volume===0)el.video.volume=1;if(el.video.paused)el.video.play().catch(()=>{});el.unmute.classList.remove('visible');haptic();toast('🔊 Audio attivato');});
  el.video.addEventListener('playing',()=>el.spinner.classList.remove('visible'));
  el.video.addEventListener('click',()=>{el.modal.classList.contains('show-controls')?el.modal.classList.remove('show-controls'):showPlayerControls();});
  let touchY=0,touchAt=0;el.video.addEventListener('touchstart',event=>{touchY=event.touches[0].clientY;touchAt=Date.now();showPlayerControls();},{passive:true});el.video.addEventListener('touchend',event=>{if(isFullscreen()||isPiP())return;const dy=event.changedTouches[0].clientY-touchY;if(dy>120&&Date.now()-touchAt<500)closePlayer();},{passive:true});



  // Ricerca, schede di navigazione e tasti indietro.
  el.search.addEventListener('input',event=>{const value=event.target.value;el.clear.classList.toggle('visible',!!value);clearTimeout(searchTimer);searchTimer=setTimeout(()=>{query=value.trim();applyFilters();},250);});
  el.clear.addEventListener('click',()=>{el.search.value='';query='';el.clear.classList.remove('visible');applyFilters();el.search.focus();});
  document.querySelectorAll('.nav-btn').forEach(button=>button.addEventListener('click',()=>{const next=button.dataset.mode;if(next===mode)return;mode=next;document.querySelectorAll('.nav-btn').forEach(item=>{const selected=item===button;item.classList.toggle('active',selected);item.setAttribute('aria-selected',String(selected));});haptic();el.content.scrollTop=0;applyFilters();}));
  if(IS_TG&&tg.BackButton){try{tg.BackButton.onClick(()=>{if(el.backup.classList.contains('visible'))closeBackup();else if(el.modal.classList.contains('open'))closePlayer();else tg.close();});}catch(e){}}
  window.addEventListener('popstate',()=>{if(el.modal.classList.contains('open'))closePlayer(true);});

  // Avvio.
  el.statsActions.appendChild(el.backupButton);loadLocalFavorites();updateFavBadge();mergeCloudFavorites();setupInfiniteScroll();loadPlaylists();
})();
</script>
</body>
