/* v16 — struttura viewport: header, contenuto flessibile, barra appoggiata al fondo */
#app{

  grid-template-columns:minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr) calc(var(--nav-h) + var(--nav-inset));

  padding:calc(8px + max(var(--safe-t),var(--tg-safe-t)) + var(--tg-content-t)) var(--pad) 8px!important;
}

  min-height:0;
  height:100%;
  overflow-x:hidden;
  overflow-y:auto;

/* Il fullscreen richiesto dai controlli nativi del video deve poter usare il top layer. */

  width:100vw!important;height:100vh!important;max-width:none!important;max-height:none!important;
  object-fit:contain!important;background:#000!important;
}
#player-modal:fullscreen,#player-modal:-webkit-full-screen{
  width:100vw!important;height:100vh!important;transform:none!important;
}
/* Evita un antenato trasformato: alcuni WebView Android bloccano il fullscreen nativo. */
#player-modal{
  transform:none!important;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity .22s ease,visibility 0s linear .22s!important;
}

  transform:none!important;
  opacity:1;

  // Imposta il video inline sulle proporzioni reali, ma lascia che il browser
  // porti l'elemento <video> nel top layer quando si usa il fullscreen integrato.
  function updatePlayerFrame(){
    const video=el.video,wrap=video.parentElement,w=video.videoWidth,h=video.videoHeight;
    if(nativeVideoFullscreen()){
      document.documentElement.classList.add('video-fullscreen');
      video.style.width='100vw';video.style.height='100vh';return;
    }
    document.documentElement.classList.remove('video-fullscreen');
    if(!w||!h||!wrap)return;
    const area=wrap.getBoundingClientRect();if(!area.width||!area.height)return;
    const scale=Math.min(area.width/w,area.height/h);
    video.style.width=Math.round(w*scale)+'px';video.style.height=Math.round(h*scale)+'px';
    requestAnimationFrame(()=>{
      if(!el.modal.classList.contains('open')||nativeVideoFullscreen())return;
      const frame=video.getBoundingClientRect(),root=getComputedStyle(document.documentElement);
      const safe=Math.max(parseFloat(root.getPropertyValue('--safe-t'))||0,parseFloat(root.getPropertyValue('--tg-safe-t'))||0);
      const topFloor=Math.max(safe+8,IS_TG?72:safe+8);
      document.documentElement.style.setProperty('--player-header-top',Math.round(Math.max(topFloor,frame.top-58))+'px');
    });
  }
  function resetPlayerFrame(){
    el.video.style.width='100%';el.video.style.height='100%';
    el.video.style.removeProperty('position');el.video.style.removeProperty('inset');
    document.documentElement.style.removeProperty('--player-header-top');
    document.documentElement.classList.remove('video-fullscreen');
  }
  function updateFullscreenButton(){
    if(!el.fullscreen)return;
    const active=isFullscreen();
    el.fullscreen.classList.toggle('active',active);
    el.fullscreen.setAttribute('aria-label',active?'Esci dallo schermo intero':'Schermo intero');
    el.fullscreen.title=active?'Esci dallo schermo intero':'Schermo intero';
    el.fullscreen.innerHTML=active
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M16 3v3a2 2 0 0 0 2 2h3"/><path d="M8 21v-3a2 2 0 0 0-2-2H3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M21 16v3a2 2 0 0 1-2 2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/></svg>';
  }
  function handleNativeFullscreenChange(){syncNativeFullscreen();updateFullscreenButton();}
  async function requestNativeVideoFullscreen(){
    if(nativeVideoFullscreen())return;
    try{
      if(typeof el.video.webkitEnterFullscreen==='function' && IS_IOS){el.video.webkitEnterFullscreen();return;}
      if(typeof el.video.requestFullscreen==='function'){
        const result=el.video.requestFullscreen({navigationUI:'hide'});
        if(result?.catch)result.catch(error=>console.warn('Fullscreen video:',error));
        return;
      }
      if(typeof el.video.webkitRequestFullscreen==='function'){el.video.webkitRequestFullscreen();return;}
      // Ultimo fallback per i client Telegram senza Fullscreen API sul video.
      if(IS_TG&&typeof tg?.requestFullscreen==='function')tg.requestFullscreen();
    }catch(error){
      console.warn('Fullscreen non disponibile:',error);
      try{if(IS_TG&&typeof tg?.requestFullscreen==='function')tg.requestFullscreen();}catch(e){}
    }
  }
  async function togglePlayerFullscreen(){
    showPlayerControls();
    if(isFullscreen()){
      try{
        if(document.fullscreenElement&&document.exitFullscreen)await document.exitFullscreen();
        else if(el.video.webkitDisplayingFullscreen&&el.video.webkitExitFullscreen)el.video.webkitExitFullscreen();
        else if(document.webkitFullscreenElement&&document.webkitExitFullscreen)document.webkitExitFullscreen();
        else if(IS_TG&&typeof tg?.exitFullscreen==='function')tg.exitFullscreen();
      }catch(error){console.warn('Uscita fullscreen:',error);}
      updateFullscreenButton();return;
    }
    // Il tentativo sull'elemento video conserva i controlli media nativi.
    try{
      if(IS_IOS&&typeof el.video.webkitEnterFullscreen==='function'){el.video.webkitEnterFullscreen();return;}
      if(typeof el.video.requestFullscreen==='function'){
        await el.video.requestFullscreen({navigationUI:'hide'});return;
      }
    }catch(error){console.warn('Fullscreen video non disponibile:',error);}
    // Fallback: contenitore del player, poi fullscreen della Mini App Telegram.
    try{
      if(typeof el.modal.requestFullscreen==='function'){
        await el.modal.requestFullscreen({navigationUI:'hide'});return;
      }
    }catch(error){console.warn('Fullscreen contenitore non disponibile:',error);}
    try{
      if(IS_TG&&typeof tg?.requestFullscreen==='function'){tg.requestFullscreen();return;}
      toast('Schermo intero non supportato in questa WebView');
    }catch(error){console.warn('Fullscreen Telegram:',error);toast('Schermo intero non disponibile');}
  }
  el.video.controls=true;
  el.video.addEventListener('loadedmetadata',updatePlayerFrame);
  el.video.addEventListener('playing',updatePlayerFrame);
  document.addEventListener('fullscreenchange',handleNativeFullscreenChange);
  document.addEventListener('webkitfullscreenchange',handleNativeFullscreenChange);
  document.addEventListener('fullscreenerror',()=>console.warn('Richiesta fullscreen rifiutata dal browser'));
  document.addEventListener('webkitfullscreenerror',()=>console.warn('Richiesta fullscreen rifiutata dal browser'));
  el.video.addEventListener('webkitbeginfullscreen',handleNativeFullscreenChange);
  el.video.addEventListener('webkitendfullscreen',handleNativeFullscreenChange);
  window.addEventListener('resize',()=>{if(el.modal.classList.contains('open'))updatePlayerFrame();});
  window.visualViewport?.addEventListener('resize',()=>{if(el.modal.classList.contains('open'))updatePlayerFrame();});
  // Doppio tocco sul video: fallback gestuale se i controlli nativi della WebView
  // non mostrano o non attivano il comando fullscreen.
  let lastVideoTap=0,lastVideoTapX=0,lastVideoTapY=0;
  el.video.addEventListener('touchend',event=>{
    const touch=event.changedTouches?.[0];if(!touch)return;
    const now=Date.now(),dx=touch.clientX-lastVideoTapX,dy=touch.clientY-lastVideoTapY;
    if(now-lastVideoTap<330&&Math.hypot(dx,dy)<34){requestNativeVideoFullscreen();lastVideoTap=0;}
    else{lastVideoTap=now;lastVideoTapX=touch.clientX;lastVideoTapY=touch.clientY;}
  },{passive:true});
  el.video.addEventListener('dblclick',requestNativeVideoFullscreen);
  function showPlayerControls(){el.modal.classList.add('show-controls');clearTimeout(controlsTimer);controlsTimer=setTimeout(()=>{if(!el.video.paused)el.modal.classList.remove('show-controls');},3500);}
  function setPlayerChannel(ch,card=null,numberLabel=null){
    activeChannel=ch;activeUrl=ch.url;
    el.number.textContent=numberLabel||('CANALE #'+ch.num);
    el.name.textContent=ch.name;
    el.logo.hidden=!ch.logo;
    if(ch.logo){el.logo.src=ch.logo;el.logo.onerror=()=>{el.logo.hidden=true;};}
    updatePlayerStar();
    document.querySelectorAll('.channel-card.active').forEach(item=>item.classList.remove('active'));
    card?.classList.add('active');
  }
  function ensurePlayerOpen(){
    if(!el.modal.classList.contains('open')){
      el.modal.classList.add('open');document.body.style.overflow='hidden';
      try{tg?.BackButton?.show();}catch(e){}
      try{history.pushState({modal:'player'},'');}catch(e){}
    }
    showPlayerControls();
  }
  function cancelRandomZap(){if(!randomZap)return;clearTimeout(randomZap.timer);randomZap=null;}
  function shuffled(list){const result=list.slice();for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]];}return result;}
  function finishRandomZap(scan){
    if(randomZap!==scan)return;
    clearTimeout(scan.timer);randomZap=null;destroyStream();el.spinner.classList.remove('visible');el.unmute.classList.remove('visible');
    el.status.replaceChildren();
    const remaining=channels.some(ch=>!scan.tried.has(ch.url)&&ch.url!==scan.source?.url);
    const message=document.createElement('div');message.textContent='Non ho trovato un canale video funzionante nei '+scan.index+' tentativi casuali.';
    const retry=document.createElement('button');retry.type='button';retry.textContent=remaining?'Cerca altri canali':'Ricomincia la ricerca';
    retry.addEventListener('click',()=>startRandomZap(scan.source,remaining?scan.tried:new Set()));
    el.status.append(message,retry);el.status.classList.add('visible');
  }
  function tryNextRandomChannel(scan){
    if(randomZap!==scan)return;
    clearTimeout(scan.timer);scan.timer=null;
    if(scan.index>=scan.limit){finishRandomZap(scan);return;}
    const ch=scan.pool[scan.index++];scan.tried.add(ch.url);
    setPlayerChannel(ch,null,'CASUALE · '+scan.index+'/'+scan.limit);
    el.status.classList.remove('visible');el.unmute.classList.remove('visible');el.spinner.classList.add('visible');
    startStream(ch.url,false,scan);
    showPlayerControls();
  }
  function skipRandomCandidate(scan,reason){
    if(randomZap!==scan)return;
    console.info('TV LIVE zapping casuale: salto canale',activeChannel?.name||'',reason||'nessun video');
    clearTimeout(scan.timer);scan.timer=null;
    tryNextRandomChannel(scan);
  }
  function startRandomZap(sourceChannel,triedBefore=new Set()){
    if(!channels.length){toast('Nessun canale disponibile');return;}
    cancelRandomZap();
    let pool=channels.filter(ch=>!triedBefore.has(ch.url)&&ch.url!==sourceChannel?.url);
    if(!pool.length){triedBefore=new Set();pool=channels.filter(ch=>ch.url!==sourceChannel?.url);}
    if(!pool.length)pool=channels.slice();
    pool=shuffled(pool);
    const scan={pool,index:0,limit:Math.min(RANDOM_ZAP_MAX,pool.length),timer:null,session:0,source:sourceChannel||null,tried:new Set(triedBefore)};
    randomZap=scan;haptic();ensurePlayerOpen();tryNextRandomChannel(scan);
  }
  function confirmRandomZap(){
    const scan=randomZap,video=el.video;
    if(!scan||scan.session!==streamSession||video.paused||video.videoWidth<=0||video.videoHeight<=0)return;
    clearTimeout(scan.timer);scan.timer=null;randomZap=null;
    el.spinner.classList.remove('visible');el.status.classList.remove('visible');
    const icon=el.unmute.querySelector('.unmute-icon'),label=el.unmute.querySelector('.unmute-label');
    if(video.muted){if(icon)icon.textContent='🔊';if(label)label.textContent='Tocca per attivare l’audio';el.unmute.classList.add('visible');}
    else el.unmute.classList.remove('visible');
    el.number.textContent='CANALE #'+(activeChannel?.num||'');
    toast('✓ Canale trovato: '+(activeChannel?.name||'TV'));
  }
  el.video.addEventListener('playing',confirmRandomZap);
  el.video.addEventListener('loadeddata',confirmRandomZap);
  function openPlayer(ch,card){cancelRandomZap();haptic();setPlayerChannel(ch,card);ensurePlayerOpen();startStream(ch.url);showPlayerControls();}
  function closePlayer(fromHistory=false){cancelRandomZap();el.modal.classList.remove('open','show-controls');document.body.style.overflow='';try{if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});else if(el.video.webkitDisplayingFullscreen&&el.video.webkitExitFullscreen)el.video.webkitExitFullscreen();}catch(e){}destroyStream();activeChannel=null;activeUrl=null;el.unmute.classList.remove('visible');try{tg?.BackButton?.hide();}catch(e){}if(!fromHistory&&history.state?.modal==='player'){try{history.back();}catch(e){}}}
  el.back.addEventListener('click',()=>closePlayer());
  el.fullscreen.addEventListener('click',togglePlayerFullscreen);updateFullscreenButton();
  el.star.addEventListener('click',()=>{if(!activeChannel)return;const active=toggleFav(activeChannel.url);updatePlayerStar();haptic();toast(active?'★ Aggiunto ai preferiti':'Rimosso dai preferiti',active);updateFavBadge();if(mode==='favorites')applyFilters();});
  el.unmute.addEventListener('click',async()=>{const icon=el.unmute.querySelector('.unmute-icon'),label=el.unmute.querySelector('.unmute-label');try{el.video.muted=false;if(el.video.volume===0)el.video.volume=1;if(el.video.paused)await el.video.play();el.unmute.classList.remove('visible');if(icon)icon.textContent='🔊';if(label)label.textContent='Tocca per attivare l’audio';haptic();}catch(error){el.video.muted=true;if(icon)icon.textContent='▶';if(label)label.textContent='Tocca per riprodurre';el.unmute.classList.add('visible');}});
  el.video.addEventListener('playing',()=>el.spinner.classList.remove('visible'));
  el.video.addEventListener('click',()=>{el.modal.classList.contains('show-controls')?el.modal.classList.remove('show-controls'):showPlayerControls();});
  let touchY=0,touchAt=0;el.video.addEventListener('touchstart',event=>{touchY=event.touches[0].clientY;touchAt=Date.now();showPlayerControls();},{passive:true});el.video.addEventListener('touchend',event=>{if(isFullscreen())return;const dy=event.changedTouches[0].clientY-touchY;if(dy>120&&Date.now()-touchAt<500)closePlayer();},{passive:true});



  // Ricerca, schede di navigazione e tasti indietro.
  el.search.addEventListener('input',event=>{const value=event.target.value;el.clear.classList.toggle('visible',!!value);clearTimeout(searchTimer);searchTimer=setTimeout(()=>{query=value.trim();applyFilters();},250);});
  el.clear.addEventListener('click',()=>{el.search.value='';query='';el.clear.classList.remove('visible');applyFilters();el.search.focus();});
  document.querySelectorAll('.nav-btn').forEach(button=>button.addEventListener('click',()=>{const next=button.dataset.mode;if(next===mode)return;mode=next;document.querySelectorAll('.nav-btn').forEach(item=>{const selected=item===button;item.classList.toggle('active',selected);item.setAttribute('aria-selected',String(selected));});haptic();el.content.scrollTop=0;applyFilters();}));
  if(IS_TG&&tg.BackButton){try{tg.BackButton.onClick(()=>{if(el.backup.classList.contains('visible'))closeBackup();else if(el.modal.classList.contains('open'))closePlayer();else tg.close();});}catch(e){}}
  window.addEventListener('popstate',()=>{if(el.modal.classList.contains('open'))closePlayer(true);});

  // Avvio.
  el.statsActions.appendChild(el.backupButton);loadLocalFavorites();updateFavBadge();mergeCloudFavorites();setupInfiniteScroll();loadPlaylists();
})();
</script>
</body>
